<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writer virtual · S02.02</title>
<style>
:root{
  --principal:#ff9944; --secundario:#81501c; --claro:#fdf4e9; --borde:#d9c9b6;
  --ok:#2e7d32; --okbg:#e8f5e9; --ko:#c62828; --kobg:#fdecea; --texto:#2b2118; --gris:#6b6258;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:#fff;font-size:19px;line-height:1.45;overflow-x:hidden}
.app{max-width:960px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--secundario);color:#fff;padding:12px 16px}
header h1{font-size:19px;margin:0 0 8px;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;font-size:16px}
.barra-prog{flex:1;height:12px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--principal);border-radius:99px;transition:width .3s}
.estrellas{font-weight:700;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 12px;white-space:nowrap}
.aviso-sto{background:#fff3cd;border-bottom:1px solid #e0b100;color:#5a4300;padding:6px 14px;font-size:15px}
.card{flex:1;padding:18px 16px}
.card h2{font-size:26px;margin:0 0 6px;color:var(--secundario)}
.ayuda{font-size:19px;margin:0 0 16px;background:var(--claro);border-left:6px solid var(--principal);padding:10px 14px;border-radius:6px}
.btn{font:inherit;font-size:20px;min-height:54px;padding:10px 22px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;color:var(--texto)}
.btn:hover{background:#f8f1e8}
.btn.pri{background:var(--principal);border-color:var(--secundario);color:#2b1a05;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.grande{font-size:22px;padding:14px 28px}
.nav{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:2px solid var(--borde);background:#faf7f3;position:sticky;bottom:0;z-index:20}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:19px}
.msg.ok{background:var(--okbg);color:#1b5e20;border:2px solid var(--ok)}
.msg.ko{background:var(--kobg);color:#8e1b1b;border:2px solid var(--ko)}
.msg.info{background:var(--claro);border:2px solid var(--borde)}
.op{font:inherit;font-size:19px;min-height:52px;padding:8px 16px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;text-align:left;color:var(--texto)}
.op:hover{background:#f8f1e8}
.op.bien{border-color:var(--ok);background:var(--okbg);font-weight:700}
.op.mal{border-color:var(--ko);background:var(--kobg)}
.op.quitada{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.opciones{display:flex;flex-direction:column;gap:10px}
.pregunta{border:2px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:12px}
.pregunta.ok{border-color:var(--ok)}
.pregunta>b{display:block;margin-bottom:8px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font:inherit;font-size:17px;border:2px solid #b9ad9f;background:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;color:var(--texto)}
.chip.vis{border-color:var(--ok);background:var(--okbg)}
.chip.sel{border-color:#ff8a00;background:#fff3e0;font-weight:700}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.recs{grid-template-columns:1fr}}
.rec{font:inherit;font-size:17px;text-align:left;border:2px solid #b9ad9f;background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--texto)}
.rec.vis{border-color:var(--ok);background:var(--okbg)}
.rec.sel{border-color:#ff8a00;background:#fff3e0}
.rec b{display:block;color:var(--ok);font-size:15px}
.nombre-pdf{font-family:Consolas,Menlo,monospace;font-size:20px;background:#f4f4f4;border:2px solid #bbb;border-radius:10px;padding:10px 14px;word-break:break-all;margin:10px 0}
input[type=text]{font:inherit;font-size:20px;min-height:52px;padding:8px 12px;border:2px solid #b9ad9f;border-radius:10px;width:100%}
.grande-ok{font-size:64px;text-align:center;margin:0}
.aprendido{background:var(--claro);border:2px solid var(--borde);border-radius:12px;padding:10px 16px;margin:12px 0}
.aprendido ul{margin:6px 0 0;padding-left:22px}
.objetivo{display:flex;flex-wrap:wrap;gap:6px 14px}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#sig.listo:not(:disabled){animation:pulso 1.2s ease-in-out infinite}
.conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:50;animation:cae 2.4s ease-in forwards}
@keyframes cae{to{transform:translateY(115vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){#sig.listo:not(:disabled){animation:none}.conf{display:none}.w-cur{animation:none}}

/* ===== ventanas simuladas ===== */
.wr,.fm{border:2px solid #9e9e9e;border-radius:8px;overflow:hidden;background:#fff;font-size:14px;line-height:1.3;position:relative;user-select:none;-webkit-user-select:none;margin-top:6px}
.c-tit{background:#3c3c3c;color:#fff;padding:6px 10px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.c-menu{display:flex;flex-wrap:wrap;gap:2px;background:#f3f3f3;border-bottom:1px solid #ddd;padding:3px 4px;position:relative}
.c-menu span{padding:3px 7px;border-radius:4px;cursor:pointer}
.c-menu span:hover,.c-menu span.abierto{background:#d6e4f5}
.c-estat{background:#f3f3f3;border-top:1px solid #ccc;padding:3px 10px;color:#555;font-size:13px;display:flex;justify-content:space-between;gap:10px}
.w-tools{background:#f9f9f9;border-bottom:1px solid #ddd}
.w-tool{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 6px;color:#444}
.w-tool+.w-tool{border-top:1px solid #eee}
.w-b{font:inherit;font-size:14px;min-width:30px;height:30px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;padding:0 6px;color:#333;line-height:1}
.w-b:hover{background:#e9f1fb}
.w-b.on{background:#cfe0f7;border-color:#1e6fd9}
.w-b.big{font-size:17px;font-weight:700;font-family:Arial,sans-serif}
.w-sep{width:1px;height:24px;background:#ccc;margin:0 3px}
.w-cb{display:inline-flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid #bbb;background:#fff;border-radius:3px;height:30px;padding:0 6px;font-size:13px;min-width:60px;color:#333}
select.w-cb{font:inherit;font-size:13px;cursor:pointer}
.w-fons{background:#e3e3e3;padding:16px 10px;display:flex;justify-content:center;min-height:300px}
.w-pag{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.3);width:min(100%,460px);min-height:320px;padding:34px 40px;font-family:"Liberation Serif","Times New Roman",Georgia,serif;font-size:15px;color:#111;line-height:1.5;position:relative;transition:width .3s,min-height .3s,padding .3s}
.w-pag.horiz{width:min(100%,640px);min-height:250px}
.w-p{margin:0 0 6px;min-height:1.3em;word-wrap:break-word}
.w-cur{display:inline-block;width:2px;height:1.15em;background:#000;vertical-align:text-bottom;animation:parp 1s steps(1) infinite;margin:0 1px}
@keyframes parp{50%{opacity:0}}
.w-w{border-radius:2px;cursor:text}
.w-w.sel{background:#9ec5ff}
.marca{color:#2a7fd4;font-family:Arial,sans-serif}
.zona{cursor:pointer;transition:box-shadow .15s}
.zona.vis{box-shadow:inset 0 0 0 3px #2e7d32}
.zona.sel{box-shadow:inset 0 0 0 4px #ff8a00}
.desp{position:absolute;background:#fff;border:1px solid #9e9e9e;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:8;min-width:230px;padding:4px 0;font-size:15px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#222}
.desp div{padding:6px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:18px}
.desp div:hover,.desp div.abierto{background:#d6e4f5}
.desp div.sep{border-top:1px solid #ddd;padding:0;margin:3px 0;cursor:default}
.desp div.off{color:#aaa;cursor:default}
.desp div.off:hover{background:none}
.desp small{color:#777}
.dialeg{position:absolute;left:50%;top:60px;transform:translateX(-50%);width:min(94%,480px);background:#f7f7f7;border:1px solid #888;box-shadow:0 6px 22px rgba(0,0,0,.35);z-index:9;border-radius:6px;overflow:hidden;font-size:15px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#222}
.dialeg .dt{background:#3c3c3c;color:#fff;padding:6px 10px}
.dialeg .dc{padding:12px}
.dialeg label{display:block;margin:6px 0 3px;font-weight:600}
.dialeg input[type=text],.dialeg select{font:inherit;font-size:16px;width:100%;padding:6px 8px;border:1px solid #999;border-radius:4px;background:#fff;min-height:0}
.dialeg .db{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.dialeg .db button{font:inherit;font-size:15px;padding:6px 16px;border:1px solid #888;border-radius:4px;background:#fff;cursor:pointer}
.dialeg .db button.p{background:#1e6fd9;color:#fff;border-color:#1556a8}
/* explorador de archivos */
.fm-bar,.fd-bar{display:flex;align-items:center;gap:8px;background:#f3f3f3;border-bottom:1px solid #ddd;padding:5px 8px}
.fm-bar button,.fd-bar button{font:inherit;font-size:15px;border:1px solid #bbb;background:#fff;border-radius:4px;padding:2px 10px;cursor:pointer}
.fm-ruta{flex:1;background:#fff;border:1px solid #ccc;border-radius:4px;padding:3px 8px;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fm-body{display:flex;min-height:250px}
.fm-llocs,.fd-llocs{width:168px;flex:none;background:#f7f7f7;border-right:1px solid #ddd;padding:6px 0}
.fm-llocs div,.fd-llocs div{padding:6px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-llocs div:hover,.fd-llocs div:hover{background:#e3edf9}
.fm-llocs div.act,.fd-llocs div.act{background:#3daee9;color:#fff}
.fm-area{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px;min-height:250px}
.fm-it{width:118px;text-align:center;padding:6px 4px;border-radius:6px;cursor:default;border:2px solid transparent}
.fm-it:hover{background:#eef5fd}
.fm-it.sel{background:#cfe6fb;border-color:#3daee9}
.fm-ico{display:block;font-size:34px;line-height:1.1}
.fm-nom{display:block;font-size:13px;word-break:break-all}
.fm-buit{color:#999;font-style:italic;padding:20px}
@media (max-width:640px){.fm-llocs,.fd-llocs{width:104px;font-size:13px}.fm-it{width:96px}}
.dialeg.fd{width:min(96%,640px);top:24px}
.fd .dc{padding:0}
.fd-body{display:flex;height:200px;border-bottom:1px solid #ddd;background:#fff}
.fd-llista{flex:1;overflow:auto}
.fd-row{display:flex;gap:8px;padding:5px 10px;cursor:default;border-bottom:1px solid #f1f1f1}
.fd-row:hover{background:#eef5fd}
.fd-row.sel{background:#3daee9;color:#fff}
.fd-peu{padding:6px 12px 12px}
@media (max-width:760px){.w-fons{min-height:260px}}

</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="titulo"></h1>
    <div class="prog"><span id="pasoTxt"></span><div class="barra-prog"><i id="barra"></i></div><span class="estrellas" id="est" title="Estrellas por acertar a la primera">⭐ 0</span></div>
  </header>
  <div class="aviso-sto" id="avisoSto" hidden>Tu navegador no deja guardar datos entre pantallas. No cierres esta página hasta descargar el resultado.</div>
  <div class="card" id="card"></div>
  <div class="nav">
    <button class="btn" id="atras">← Atrás</button>
    <button class="btn pri" id="sig">Siguiente →</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var MODO=((location.hash||"").toLowerCase()==="#ficha")?"ficha":"practica";
var CFG, PRACTICA, PASOS, LISTAS={}, paso=0, prevOk={}, mem=null, stoOk=true, ULT={k:"",t:0}, ARR=null;

/* ===== almacenamiento compartido entre la práctica y la ficha ===== */
function KEY(){return CFG.slug+"-ofimatica-v1";}
function cargar(){
  var o=null;
  try{var s=localStorage.getItem(KEY());if(s)o=JSON.parse(s);}catch(e){stoOk=false;}
  if(!o)o=mem||{};
  o.alumno=o.alumno||""; o.reg=o.reg||{}; ["practica","ficha"].forEach(function(m){var r=o.reg[m]=o.reg[m]||{};r.t=r.t||{};r.f=r.f||{};r.ok=r.ok||{};r.ini=r.ini||"";}); o.practica=o.practica||{}; o.ficha=o.ficha||{}; o.err=o.err||{}; o.est=o.est||{}; o.fails=o.fails||{};
  return o;
}
function guardar(o){mem=o;try{localStorage.setItem(KEY(),JSON.stringify(o));}catch(e){stoOk=false;$("avisoSto").hidden=false;}}
function upd(fn){var o=cargar();fn(o);guardar(o);}
function ahora(){var d=new Date(),z=function(n){return (n<10?"0":"")+n;};return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes());}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]/g,"");}
function nombrePDF(a,tipo){var p=a.trim().split(/\s+/).filter(Boolean);return p.length<2?null:CFG.id+"_"+(tipo||"Resultado")+"_"+norm(p[0])+"_"+norm(p.slice(1).join(""))+".pdf";}
function error(k){upd(function(o){o.err[k]=(o.err[k]||0)+1;var r=o.reg[MODO];r.f[paso]=(r.f[paso]||0)+1;});}
/* ===== registro de tiempo activo por paso ===== */
var ULTACT=Date.now(), BUF={}, NBUF=0;
function actividad(){ULTACT=Date.now();}
function volcarTiempo(){if(!NBUF)return;var b=BUF;BUF={};NBUF=0;upd(function(o){var r=o.reg[MODO];if(!r.ini)r.ini=ahora();for(var k in b)r.t[k]=(r.t[k]||0)+b[k];});}
function tic(){if(document.hidden||Date.now()-ULTACT>120000)return;BUF[paso]=(BUF[paso]||0)+1;NBUF++;if(NBUF>=5)volcarTiempo();}
function mmss(x){x=Math.round(x||0);var m=Math.floor(x/60),s=x%60;return m+" min "+(s<10?"0":"")+s+" s";}
function esFicha(k){return /^f\d\d+$/.test(k);}
function dobleClic(k){var n=Date.now(),d=ULT.k===k&&n-ULT.t<450;ULT={k:d?"":k,t:n};return d;}
function tieneTilde(s){return /[áéíóúàèìòùäëïöüñçÁÉÍÓÚÀÈÌÒÙÄËÏÖÜÑÇ]/.test(s);}

/* ===== feedback positivo ===== */
var ELOGIOS=["¡Muy bien!","¡Genial!","¡Eso es!","¡Perfecto!","¡Buen trabajo!","¡Lo has clavado!","¡Excelente!"];
var ANIMOS=["¡Casi! Inténtalo otra vez.","¡Sin problema! Prueba de nuevo.","¡Ánimo, tú puedes!","Piénsalo un momento y vuelve a probar."];
function elogio(seed){return ELOGIOS[Math.abs(seed|0)%ELOGIOS.length];}
function animo(n){return ANIMOS[Math.abs(n|0)%ANIMOS.length];}
function semilla(t){t=String(t);var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return Math.abs(h);}
function intento(clave,ok){upd(function(o){if(ok){if(!o.fails[clave])o.est[clave]=1;}else o.fails[clave]=(o.fails[clave]||0)+1;});}
function numEst(){return Object.keys(cargar().est).length;}
function confeti(){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  var em=["🎉","⭐","✨","🎊","🌟"];
  for(var i=0;i<22;i++){
    var d=document.createElement("span");d.className="conf";d.textContent=em[i%em.length];
    d.style.left=(Math.random()*96)+"vw";d.style.animationDelay=(Math.random()*0.6)+"s";d.style.fontSize=(22+Math.random()*16)+"px";
    document.body.appendChild(d);(function(x){setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x);},3200);})(d);
  }
}
function msg(m,ok){return m?'<div class="msg '+(/^(👆|ℹ️)/.test(m)?"info":(ok?"ok":"ko"))+'">'+m+'</div>':"";}
function info(m){return '<div class="msg info">'+m+'</div>';}
function objetivo(lista){return '<div class="msg info objetivo"><span>Objetivo:</span>'+lista.map(function(x){return '<span>'+(x[1]?"✔":"⬜")+" "+x[0]+'</span>';}).join("")+'</div>';}
function finPractica(lineas){upd(function(o){o.practica={ok:true,t:ahora(),lineas:lineas||[]};});}
function bloqueFinPractica(){
  var o=cargar(), f=nombrePDF(o.alumno,"Practica");
  return '<p class="grande-ok">🎉</p><div class="msg ok"><b>¡Práctica terminada!</b> Has conseguido <b>⭐ '+numEst()+'</b> estrellas.</div>'+
    '<div class="aprendido"><b>Descarga el informe de la práctica</b><p style="margin:6px 0 4px">Escribe tu nombre y apellidos:</p><input type="text" id="inNombre" value="'+esc(o.alumno)+'" placeholder="Por ejemplo: Lucía Martí Pons" autocomplete="name">'+
    '<p style="margin:10px 0 0"><b>Se guardará como:</b></p><div class="nombre-pdf" id="nomPdf">'+(f?esc(f):CFG.id+"_Practica_Nombre_Apellido.pdf")+'</div>'+
    '<button class="btn pri grande" id="btnDescarga" data-act="descargar"'+(f?"":" disabled")+'>⬇️ Descargar el informe de la práctica</button></div>'+
    '<div class="msg info"><b>Después:</b> pasa a la <b>ficha</b> (Parte 2) y, al final, haz lo mismo en tu ordenador (Parte 3).</div>';
}

/* ===== unir nombres con su descripción o con una zona ===== */
function nuevoUnir(){return {sel:null,tgt:null,done:{},msg:"",ok:false};}
function unirItem(u,id){return u.items.filter(function(x){return x[0]===id;})[0];}
function unirChips(u){
  var st=u.st;
  return '<div class="chips">'+u.items.map(function(x){return '<button class="chip'+(st.done[x[0]]?" vis":"")+(st.sel===x[0]?" sel":"")+'" data-u-n="'+x[0]+'">'+(st.done[x[0]]?"✔ ":"")+x[1]+'</button>';}).join("")+'</div>';
}
function unirRecs(u){
  var st=u.st, orden=u.items.slice().sort(function(a,b){return semilla(a[2])-semilla(b[2]);});
  return '<div class="recs">'+orden.map(function(x){return '<button class="rec'+(st.done[x[0]]?" vis":"")+(st.tgt===x[0]?" sel":"")+'" data-u-t="'+x[0]+'">'+(st.done[x[0]]?'<b>✔ '+x[1]+'</b>':"")+x[2]+'</button>';}).join("")+'</div>';
}
function unirOk(u){return Object.keys(u.st.done).length===u.items.length;}
function unirProbar(u){
  var st=u.st; if(!st.sel||!st.tgt)return;
  var x=unirItem(u,st.sel);
  if(st.sel===st.tgt){st.done[st.sel]=true;intento(u.clave+"_"+st.sel,true);st.msg="✔ <b>"+elogio(semilla(st.sel))+"</b> <b>"+x[1]+"</b>: "+(x[3]||x[2]);st.ok=true;}
  else{intento(u.clave+"_"+st.sel,false);error(u.clave);var y=unirItem(u,st.tgt);st.msg="¡Casi! Eso no corresponde a «<b>"+x[1]+"</b>»"+(u.zonas&&y?": esa parte es <b>"+y[1]+"</b>":"")+". ¡Prueba otra vez!";st.ok=false;}
  st.sel=null;st.tgt=null;
}
function unirClic(t,u){
  var st=u.st, n=t.closest("[data-u-n]"), g=t.closest("[data-u-t]");
  if(n){var v=n.getAttribute("data-u-n");if(st.done[v]){st.msg="✔ Ya la tienes unida.";st.ok=true;}else{st.sel=v;if(st.tgt)unirProbar(u);else{st.msg=u.zonas?"👆 Ahora pulsa esa parte en la ventana.":"👆 Ahora pulsa su descripción.";st.ok=false;}}render();return true;}
  if(g){var w=g.getAttribute("data-u-t");if(st.done[w]){st.msg="✔ Esa ya está unida.";st.ok=true;}else{st.tgt=w;if(st.sel)unirProbar(u);else{st.msg="👆 Ahora pulsa el <b>nombre</b> que le corresponde.";st.ok=false;}}render();return true;}
  return false;
}

/* ===== ventana de Writer ===== */
var WMENUS=["Fitxer","Edita","Visualitza","Insereix","Format","Estils","Taula","Formulari","Eines","Finestra","Ajuda"];
function zonaAttr(op,id){
  if(!op.zonas)return "";
  var st=PASOS[paso].unir.st,c=" zona";

function cp1252(s){
  var map={"—":"\x97","–":"\x96","“":"\x93","”":"\x94","‘":"\x91","’":"\x92","•":"\x95","…":"\x85","€":"\x80","→":"->","›":">","✔":"[x]","✖":"[ ]","−":"-","·":"\xB7"};

    else out+="?";
  }
  return out;
}

    if((act+" "+w).trim().length>max){l.push(act);act=w;}else act=(act?act+" ":"")+w;
  });

}
function construyePDF(lineas){

      y-=lh;
      pags[pags.length-1].push("BT /"+(L.b?"F2":"F1")+" "+size+" Tf "+(M+sang*size*0.53+(idx&&L.h?size*1.2:0)).toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(txt)+") Tj ET");
    });
  });
  var n=pags.length,total=4+n*2;
  var lista=[null,"<< /Type /Catalog /Pages 2 0 R >>",null,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
  var kids=[];

    kids.push(idp+" 0 R");

  var pdf="%PDF-1.4\n",offs=[];
  for(var k=1;k<=total;k++){offs[k]=pdf.length;pdf+=k+" 0 obj\n"+lista[k]+"\nendobj\n";}
  var xref=pdf.length;
  pdf+="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(var q=1;q<=total;q++)pdf+=("0000000000"+offs[q]).slice(-10)+" 00000 n \n";
  pdf+="trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  var bytes=new Uint8Array(pdf.length);

  return bytes;
}

  document.addEventListener("mouseup",function(e){var p=PASOS[paso];if(p.onUp)p.onUp(e);});
