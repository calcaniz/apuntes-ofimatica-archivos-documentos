<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspección de seguridad</title>
<style>
:root{
  --principal:#ff9944; --secundario:#81501c; --claro:#fdf4e9; --borde:#d9c9b6;
  --ok:#2e7d32; --okbg:#e8f5e9; --ko:#c62828; --kobg:#fdecea; --texto:#2b2118; --gris:#6b6258;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:#fff;font-size:19px;line-height:1.45;overflow-x:hidden}
.app{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--secundario);color:#fff;padding:12px 16px}
header h1{font-size:19px;margin:0 0 8px;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;font-size:16px}
.barra-prog{flex:1;height:12px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--principal);border-radius:99px;transition:width .3s}
.estrellas{font-weight:700;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 12px;white-space:nowrap}
.aviso-sto{background:#fff3cd;border-bottom:1px solid #e0b100;color:#5a4300;padding:6px 14px;font-size:15px}
.card{flex:1;padding:18px 16px}
.card h2{font-size:26px;margin:0 0 6px;color:var(--secundario)}
.ayuda{font-size:19px;margin:0 0 16px;background:var(--claro);border-left:6px solid var(--principal);padding:10px 14px;border-radius:6px}
.btn{font:inherit;font-size:20px;min-height:54px;padding:10px 22px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;color:var(--texto)}
.btn:hover{background:#f8f1e8}
.btn.pri{background:var(--principal);border-color:var(--secundario);color:#2b1a05;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.grande{font-size:22px;padding:14px 28px}
.op{font:inherit;font-size:19px;min-height:52px;padding:8px 16px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;text-align:left;color:var(--texto)}
.op:hover{background:#f8f1e8}
.op.sel{border-color:var(--secundario);background:var(--claro);font-weight:700}
.op.bien{border-color:var(--ok);background:var(--okbg);font-weight:700}
.op.mal{border-color:var(--ko);background:var(--kobg)}
.op.quitada{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.opciones{display:flex;flex-wrap:wrap;gap:10px}
.nav{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:2px solid var(--borde);background:#faf7f3;position:sticky;bottom:0}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#sig.listo:not(:disabled){animation:pulso 1.2s ease-in-out infinite}
.conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:50;animation:cae 2.4s ease-in forwards}
@keyframes cae{to{transform:translateY(115vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){#sig.listo:not(:disabled){animation:none}.conf{display:none}}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:19px}
.msg.ok{background:var(--okbg);color:#1b5e20;border:2px solid var(--ok)}
.msg.ko{background:var(--kobg);color:#8e1b1b;border:2px solid var(--ko)}
.msg.info{background:var(--claro);border:2px solid var(--borde)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:700px){.dos{grid-template-columns:1fr}}
.cont{font-size:18px;margin:8px 0}
.chips{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.chip{font:inherit;font-size:18px;border:2px solid #b9ad9f;background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--texto);text-align:left}
.chip.sel{border-color:var(--secundario);background:var(--claro);font-weight:700}
.chip.vis{border-color:var(--ok);background:var(--okbg);cursor:default}
.def{font:inherit;font-size:17px;border:2px solid #b9ad9f;background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--texto);text-align:left}
.def.sel{border-color:var(--secundario);background:var(--claro)}
.escena{background:#f4f1ec;border:2px solid var(--borde);border-radius:14px;padding:6px}
.escena svg{width:100%;height:auto;display:block}
.zona{fill:transparent;cursor:pointer}
.zona:hover{fill:rgba(255,153,68,.18)}
.zona.sel{stroke:#ff8a00;stroke-width:4}
.zona.pista{stroke:#c62828;stroke-width:4;stroke-dasharray:7 5;fill:rgba(198,40,40,.08)}
.zona.hecho{cursor:default}
.orden{list-style:none;margin:0 0 10px;padding:0}
.orden li{padding:8px 12px;border-radius:10px;margin-bottom:6px;background:var(--okbg);border:2px solid var(--ok);font-size:18px}
.objeto{border:3px solid var(--secundario);background:var(--claro);border-radius:14px;padding:18px;text-align:center;font-size:24px;font-weight:700;margin:8px 0 12px}
.objeto small{display:block;font-size:16px;font-weight:400;color:var(--gris)}
.contenedores{display:flex;flex-direction:column;gap:8px}
.pregunta{border:2px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:12px}
.pregunta.ok{border-color:var(--ok)}
.pregunta>b{display:block;margin-bottom:8px;font-size:20px}
.pregunta .opciones{flex-direction:column}
.pregunta .op{width:100%}
.nombre-pdf{font-family:Consolas,Menlo,monospace;font-size:20px;background:#f4f4f4;border:2px solid #bbb;border-radius:10px;padding:10px 14px;word-break:break-all;margin:10px 0}
input[type=text]{font:inherit;font-size:20px;min-height:52px;padding:8px 12px;border:2px solid #b9ad9f;border-radius:10px;width:100%}
.grande-ok{font-size:64px;text-align:center;margin:0}
.aprendido{background:var(--claro);border:2px solid var(--borde);border-radius:12px;padding:10px 16px;margin:12px 0}
.aprendido ul{margin:6px 0 0;padding-left:22px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="titulo">🦺 Inspección de seguridad</h1>
    <div class="prog"><span id="pasoTxt"></span><div class="barra-prog"><i id="barra"></i></div><span class="estrellas" id="est" title="Estrellas por acertar a la primera">⭐ 0</span></div>
  </header>
  <div class="aviso-sto" id="avisoSto" hidden>Tu navegador no deja guardar datos entre pantallas. No cierres esta página hasta descargar el resultado.</div>
  <div class="card" id="card"></div>
  <div class="nav">
    <button class="btn" id="atras">← Atrás</button>
    <button class="btn pri" id="sig">Siguiente →</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ===== almacenamiento compartido entre la práctica y la ficha ===== */
var KEY="s0306-ofimatica-v1", mem=null, stoOk=true;
function cargar(){
  var o=null;
  try{var s=localStorage.getItem(KEY);if(s)o=JSON.parse(s);}catch(e){stoOk=false;}
  if(!o)o=mem||{};
  o.alumno=o.alumno||""; o.practica=o.practica||{}; o.ficha=o.ficha||{}; o.err=o.err||{}; o.est=o.est||{}; o.fails=o.fails||{};
  return o;
}
function guardar(o){mem=o;try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){stoOk=false;$("avisoSto").hidden=false;}}
function upd(fn){var o=cargar();fn(o);guardar(o);}
function ahora(){var d=new Date(),z=function(n){return (n<10?"0":"")+n;};return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes());}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]/g,"");}
function nombrePDF(a,tipo){var p=a.trim().split(/\s+/).filter(Boolean);return p.length<2?null:"S03.06_"+(tipo||"Resultado")+"_"+norm(p[0])+"_"+norm(p.slice(1).join(""))+".pdf";}
function error(k){upd(function(o){o.err[k]=(o.err[k]||0)+1;});}

/* ===== feedback positivo ===== */
var ELOGIOS=["¡Muy bien!","¡Genial!","¡Eso es!","¡Perfecto!","¡Buen trabajo!","¡Lo has clavado!","¡Excelente!"];
var ANIMOS=["¡Casi! Inténtalo otra vez.","¡Sin problema! Prueba de nuevo.","¡Ánimo, tú puedes!","Piénsalo un momento y vuelve a probar."];
function elogio(seed){return ELOGIOS[Math.abs(seed|0)%ELOGIOS.length];}
function animo(n){return ANIMOS[Math.abs(n|0)%ANIMOS.length];}
function semilla(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return Math.abs(h);}
function intento(clave,ok){upd(function(o){if(ok){if(!o.fails[clave])o.est[clave]=1;}else o.fails[clave]=(o.fails[clave]||0)+1;});}
function numEst(){return Object.keys(cargar().est).length;}
function confeti(){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  var em=["🎉","⭐","✨","🎊","🌟"];
  for(var i=0;i<22;i++){
    var d=document.createElement("span");d.className="conf";d.textContent=em[i%em.length];
    d.style.left=(Math.random()*96)+"vw";d.style.animationDelay=(Math.random()*0.6)+"s";d.style.fontSize=(22+Math.random()*16)+"px";
    document.body.appendChild(d);(function(x){setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x);},3200);})(d);
  }
}

/* ===== datos ===== */
var RIESGOS=[
 ["electrico","Riesgo eléctrico","Usar un cable roto o tocar un enchufe con las manos mojadas."],
 ["termico","Riesgo térmico (calor)","Tocar las partes internas calientes de una impresora láser o fotocopiadora."],
 ["atrapamiento","Atrapamiento","Meter las manos en rodillos, bandejas o mecanismos en movimiento."],
 ["irritantes","Sustancias irritantes","Derramar tinta o entrar en contacto con el polvo de tóner."],
 ["luminosa","Radiación luminosa","Mirar directamente la luz del escáner mientras funciona."],
 ["caidas","Caídas y golpes","Dejar cables o cajas de papel en una zona de paso."]
];
function riesgo(id){return RIESGOS.filter(function(c){return c[0]===id;})[0];}
var ORDEN_C=["luminosa","electrico","caidas","atrapamiento","irritantes","termico"];
var ORDEN_D=["caidas","irritantes","termico","luminosa","electrico","atrapamiento"];
function relComprobar(){
  var r=S.rel; if(!r.name||!r.part)return;
  if(r.name===r.part){
    var x=riesgo(r.name); intento("rel_"+r.name,true);
    r.done[r.name]=true; r.msg="✔ <b>"+elogio(semilla(r.name))+"</b> "+x[1]+": "+x[2]; r.ok=true; r.name=null; r.part=null;
  }else{
    intento("rel_"+r.name,false); r.msg="¡Casi! Ese ejemplo no es de ese riesgo. ¡Prueba otra vez, tú puedes!"; r.ok=false; r.part=null; error("relaciona");
  }
}
/* peligros de la escena: id, nombre, centro (x,y), zona (x,y,w,h), opciones */
var PELIGROS=[
 {id:"liquido",nombre:"Botella de agua junto a la fotocopiadora",cx:380,cy:152,z:[360,126,42,56],
  ops:["Dejarla: está bien tapada","Retirarla: ningún líquido cerca de los equipos eléctricos","Moverla al otro lado de la máquina"],corr:1,
  exp:"Un líquido derramado sobre un equipo eléctrico puede provocar un cortocircuito o una descarga."},
 {id:"cable",nombre:"Cable con los hilos al descubierto",cx:104,cy:186,z:[72,158,64,56],
  ops:["No usar el equipo y comunicar la incidencia","Taparlo con cinta y seguir usándolo","Tirar del cable para ver si funciona"],corr:0,
  exp:"Un cable dañado puede dar una descarga eléctrica: no se usa, y se avisa."},
 {id:"suelo",nombre:"Cables cruzando la zona de paso",cx:372,cy:292,z:[112,250,324,56],
  ops:["Recogerlos y apartarlos de la zona de paso","Dejarlos: la gente ya sabe que están","Taparlos con unos folios"],corr:0,
  exp:"Los cables por el suelo provocan tropiezos y caídas."},
 {id:"caja",nombre:"Caja de papel muy pesada en el suelo",cx:484,cy:268,z:[436,230,92,72],
  ops:["Levantarla yo solo, rápido","Arrastrarla de golpe","Pedir ayuda para moverla"],corr:2,
  exp:"Cargar peso de forma incorrecta causa lesiones musculares: se pide ayuda."},
 {id:"toner",nombre:"Tóner derramado en el suelo",cx:250,cy:266,z:[200,246,100,40],
  ops:["Soplar el polvo","Barrerlo con fuerza","No soplarlo ni tocarlo: avisar y seguir el procedimiento"],corr:2,
  exp:"El polvo de tóner puede irritar: no se levanta polvo y se avisa a la persona responsable."},
 {id:"humo",nombre:"Sale humo de la impresora",cx:340,cy:62,z:[296,30,86,62],
  ops:["Seguir imprimiendo","Detener el equipo, alejarme y avisar enseguida","Abrir la tapa para mirar dentro"],corr:1,
  exp:"El humo o un olor raro son peligrosos: se detiene el equipo, te alejas y avisas."}
];
var ATASCO=[
 ["Detener el trabajo","Esto va primero: detén el trabajo.","Primero se para el equipo para no empeorar el atasco."],
 ["Leer el mensaje de la pantalla","Antes de abrir nada hay que detener el trabajo y leer el mensaje.","El mensaje te dice dónde está el atasco."],
 ["Abrir solo las tapas señaladas","Primero lee el mensaje: él te dice qué tapas abrir.","Algunas partes están calientes: solo se abre lo señalado."],
 ["Retirar el papel despacio, en la dirección indicada","Antes hay que abrir las tapas señaladas.","Si tiras con fuerza, el papel se rompe y quedan trozos dentro."],
 ["Cerrar bien las tapas","Primero hay que retirar todo el papel.","Con las tapas bien cerradas, la máquina vuelve a funcionar."],
 ["Hacer una copia de prueba","La prueba va al final, cuando ya está todo cerrado.","La prueba comprueba que el equipo ya funciona bien."]
];
var ORDEN_A=[3,0,5,2,4,1];
var RESIDUOS=[
 ["Folleto de papel",0,"El papel de impresión, los folletos y las revistas van al contenedor de papel. Antes, quita grapas y clips."],
 ["Tique de compra (papel térmico)",2,"El papel térmico de los tiques no se recicla con el papel normal."],
 ["Cartucho de tóner vacío",1,"Los cartuchos son residuos especiales: se entregan en un punto de recogida."],
 ["Caja de cartón limpia",0,"El cartón limpio es papel: se dobla para que ocupe menos."],
 ["Etiquetas adhesivas",2,"El adhesivo hace que no se pueda reciclar como papel."],
 ["Cable viejo",1,"Los cables son residuos electrónicos: punto limpio o de recogida."],
 ["Papel manchado de grasa",2,"Si está manchado de grasa, pintura u otros productos, no se recicla como papel."],
 ["Hoja de impresión usada",0,"Las hojas de impresión usadas se reciclan en el contenedor de papel."]
];
var CONT=["📘 Contenedor de papel (azul)","♻️ Punto limpio o de recogida","🗑️ Contenedor de restos"];
var AH=[
 ["¿Cómo gastas menos papel?",["Imprimiendo siempre por una cara","Revisando la vista previa e imprimiendo solo lo necesario","Haciendo copias de más por si acaso"],1,"La vista previa, la doble cara y las copias justas ahorran mucho papel."],
 ["¿Cómo gastas menos tinta o tóner?",["Usando modo borrador en las pruebas y blanco y negro si no hace falta color","Imprimiendo todo en color y en alta calidad","Repitiendo el trabajo varias veces"],0,"El modo borrador y el blanco y negro gastan menos consumible."],
 ["¿Cómo ahorras energía?",["Dejando todos los equipos encendidos","Encendiendo todas las máquinas a la vez","Activando el ahorro de energía y apagando al terminar"],2,"Un equipo apagado o en ahorro de energía consume mucho menos."]
];

/* estado en memoria */
var S={
  rel:{name:null,part:null,done:{},msg:"",ok:false},
  insp:{fixed:{},sel:null,ans:{},pista:null},
  a:{orden:[],msg:"",ok:false},
  rec:{i:0,msg:"",ok:false,fallos:0},
  ah:{}
};
var paso=0;
var MODO=((location.hash||"").toLowerCase()==="#ficha")?"ficha":"practica";

function opB(act,data,txt,sel){
  var at="";for(var k in data)at+=' data-'+k+'="'+esc(data[k])+'"';
  return '<button class="op'+(sel?" sel":"")+'" data-act="'+act+'"'+at+'>'+txt+'</button>';
}
function msg(m,ok){return m?'<div class="msg '+(ok?"ok":"ko")+'">'+m+'</div>':"";}
function hazIdx(id){for(var i=0;i<PELIGROS.length;i++)if(PELIGROS[i].id===id)return i;return -1;}

/* ===== escena del taller ===== */
function escena(o){
  var f=o.fixed||{};
  function tenue(id,txt){return f[id]?'<g opacity=".18">'+txt+'</g>':txt;}
  var s='<svg viewBox="0 0 560 330" role="img" aria-label="Taller de reprografía">';
  s+='<rect x="0" y="0" width="560" height="230" fill="#f3eee6"/><rect x="0" y="230" width="560" height="100" fill="#d8cdbb"/><line x1="0" y1="230" x2="560" y2="230" stroke="#b9ad9b" stroke-width="3"/>';
  s+='<rect x="430" y="34" width="100" height="82" fill="#d3ebf8" stroke="#8aa5b5" stroke-width="3"/><line x1="480" y1="34" x2="480" y2="116" stroke="#8aa5b5" stroke-width="3"/>';
  s+='<rect x="34" y="176" width="24" height="32" rx="3" fill="#fff" stroke="#888" stroke-width="2"/><circle cx="43" cy="188" r="2.5" fill="#444"/><circle cx="49" cy="188" r="2.5" fill="#444"/><circle cx="46" cy="198" r="2.5" fill="#444"/>';
  s+='<rect x="100" y="180" width="320" height="12" fill="#8b6b4a"/><rect x="110" y="192" width="10" height="58" fill="#7a5c3d"/><rect x="400" y="192" width="10" height="58" fill="#7a5c3d"/>';
  s+='<rect x="150" y="100" width="200" height="80" rx="6" fill="#e9e3d9" stroke="#8a8278" stroke-width="3"/><rect x="150" y="84" width="200" height="18" rx="4" fill="#d6cec1" stroke="#8a8278" stroke-width="3"/>';
  s+='<rect x="288" y="118" width="50" height="24" rx="3" fill="#3b3b3b"/><rect x="170" y="154" width="80" height="14" rx="3" fill="#cfc7b8" stroke="#8a8278" stroke-width="2"/>';
  /* cable que va al enchufe: se ve ordenado si está resuelto */
  s+='<path d="M150 162 C 110 164, 90 204, 58 194" stroke="#333" stroke-width="4" fill="none"/>';
  if(!f.cable)s+='<polyline points="92,178 98,186 94,190 102,196" fill="none" stroke="#d4a017" stroke-width="3"/><polyline points="96,172 102,180 98,186" fill="none" stroke="#c0392b" stroke-width="3"/><text x="110" y="178" font-size="20">⚡</text>';
  /* botella */
  s+=tenue("liquido",'<rect x="372" y="140" width="16" height="38" rx="3" fill="#6ec1e4" stroke="#2b6fa3" stroke-width="2"/><rect x="375" y="132" width="10" height="9" rx="2" fill="#2b6fa3"/>');
  /* cables por el suelo */
  s+=tenue("suelo",'<path d="M120 252 C 200 304, 300 252, 430 292" stroke="#444" stroke-width="5" fill="none"/><path d="M130 250 C 220 300, 330 262, 400 296" stroke="#777" stroke-width="4" fill="none"/>');
  /* caja */
  s+=tenue("caja",'<rect x="442" y="236" width="82" height="64" fill="#c8a06b" stroke="#8a6a3a" stroke-width="3"/><text x="483" y="274" text-anchor="middle" font-size="16" font-weight="700" font-family="sans-serif" fill="#5a3f1a">20 kg</text>');
  /* tóner */
  s+=tenue("toner",'<ellipse cx="250" cy="268" rx="38" ry="11" fill="#222"/><rect x="278" y="256" width="30" height="14" rx="3" fill="#555" transform="rotate(-18 292 263)"/>');
  /* humo */
  s+=tenue("humo",'<circle cx="322" cy="68" r="15" fill="#9a9a9a"/><circle cx="342" cy="56" r="19" fill="#8c8c8c"/><circle cx="364" cy="66" r="14" fill="#9a9a9a"/><circle cx="346" cy="40" r="11" fill="#adadad"/>');
  /* zonas pulsables y marcas */
  PELIGROS.forEach(function(h){
    var cls="zona"+(f[h.id]?" hecho":"")+(o.sel===h.id?" sel":"")+(o.pista===h.id&&!f[h.id]?" pista":"");
    s+='<rect class="'+cls+'" data-h="'+h.id+'" x="'+h.z[0]+'" y="'+h.z[1]+'" width="'+h.z[2]+'" height="'+h.z[3]+'" rx="8"><title>Zona del taller</title></rect>';
    if(f[h.id])s+='<circle cx="'+h.cx+'" cy="'+h.cy+'" r="14" fill="#2e7d32" stroke="#fff" stroke-width="3" pointer-events="none"/><text x="'+h.cx+'" y="'+(h.cy+6)+'" text-anchor="middle" font-size="18" fill="#fff" font-weight="700" pointer-events="none">✓</text>';
  });
  return '<div class="escena">'+s+'</svg></div>';
}

/* ===== PRÁCTICA ===== */
var PRACTICA=[
 {t:"1. Une cada riesgo con su ejemplo",
  ayuda:"<b>1.</b> Pulsa un riesgo. <b>2.</b> Pulsa su ejemplo. Si aciertas, se queda en verde.",
  html:function(){
    var r=S.rel, n=Object.keys(r.done).length;

/* ===== PDF ===== */
function cp1252(s){
  var map={"—":"\x97","–":"\x96","“":"\x93","”":"\x94","‘":"\x91","’":"\x92","•":"\x95","…":"\x85","€":"\x80","→":"->","✔":"[x]","✖":"[ ]","−":"-","⚠️":""};
  s=String(s).normalize("NFC");var out="";
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i),c=ch.charCodeAt(0);
    if(map.hasOwnProperty(ch))out+=map[ch];
    else if(c>=0xD800&&c<=0xDFFF){}
    else if(c<32)out+=" ";
    else if(c<127||(c>=160&&c<256))out+=ch;
    else out+="?";
  }
  return out;
}
function pdfEsc(s){return s.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");}
function envolver(texto,size,sangria){
  var max=Math.floor(495/(0.53*size))-(sangria||0),pal=cp1252(texto).split(" "),l=[],act="";
  pal.forEach(function(w){
    while(w.length>max){if(act){l.push(act);act="";}l.push(w.slice(0,max));w=w.slice(max);}
    if((act+" "+w).trim().length>max){l.push(act);act=w;}else act=(act?act+" ":"")+w;
  });
  l.push(act);return l;
}
function construyePDF(lineas){
  var pags=[[]],y=792,M=50;
  lineas.forEach(function(L){
    var size=L.s||11,lh=size*1.4,sang=L.i||0;
    var partes=L.t===""?[""]:envolver(L.t,size,sang);
    partes.forEach(function(txt,idx){
      if(y-lh<M){pags.push([]);y=792;}
      y-=lh;
      pags[pags.length-1].push("BT /"+(L.b?"F2":"F1")+" "+size+" Tf "+(M+sang*size*0.53+(idx&&L.h?size*1.2:0)).toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(txt)+") Tj ET");
    });
  });
  var n=pags.length,total=4+n*2;
  var lista=[null,"<< /Type /Catalog /Pages 2 0 R >>",null,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
  var kids=[];
  pags.forEach(function(p,i){
    var idc=5+i*2,idp=6+i*2,cont=p.join("\n");
    lista[idc]="<< /Length "+cont.length+" >>\nstream\n"+cont+"\nendstream";
    lista[idp]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+idc+" 0 R >>";
    kids.push(idp+" 0 R");
  });
  lista[2]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>";
  var pdf="%PDF-1.4\n",offs=[];
  for(var k=1;k<=total;k++){offs[k]=pdf.length;pdf+=k+" 0 obj\n"+lista[k]+"\nendobj\n";}
  var xref=pdf.length;
  pdf+="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(var q=1;q<=total;q++)pdf+=("0000000000"+offs[q]).slice(-10)+" 00000 n \n";
  pdf+="trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  var bytes=new Uint8Array(pdf.length);
  for(var b=0;b<pdf.length;b++)bytes[b]=pdf.charCodeAt(b)&255;
  return bytes;
}
