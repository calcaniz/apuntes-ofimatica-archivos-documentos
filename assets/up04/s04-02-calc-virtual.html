<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calc virtual · S04.02</title>
<style>
:root{
  --principal:#ff9944; --secundario:#81501c; --claro:#fdf4e9; --borde:#d9c9b6;
  --ok:#2e7d32; --okbg:#e8f5e9; --ko:#c62828; --kobg:#fdecea; --texto:#2b2118; --gris:#6b6258;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:#fff;font-size:19px;line-height:1.45;overflow-x:hidden}
.app{max-width:960px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--secundario);color:#fff;padding:12px 16px}
header h1{font-size:19px;margin:0 0 8px;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;font-size:16px}
.barra-prog{flex:1;height:12px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--principal);border-radius:99px;transition:width .3s}
.estrellas{font-weight:700;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 12px;white-space:nowrap}
.aviso-sto{background:#fff3cd;border-bottom:1px solid #e0b100;color:#5a4300;padding:6px 14px;font-size:15px}
.card{flex:1;padding:18px 16px}
.card h2{font-size:26px;margin:0 0 6px;color:var(--secundario)}
.ayuda{font-size:19px;margin:0 0 16px;background:var(--claro);border-left:6px solid var(--principal);padding:10px 14px;border-radius:6px}
.btn{font:inherit;font-size:20px;min-height:54px;padding:10px 22px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;color:var(--texto)}
.btn:hover{background:#f8f1e8}
.btn.pri{background:var(--principal);border-color:var(--secundario);color:#2b1a05;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.grande{font-size:22px;padding:14px 28px}
.nav{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:2px solid var(--borde);background:#faf7f3;position:sticky;bottom:0}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:19px}
.msg.ok{background:var(--okbg);color:#1b5e20;border:2px solid var(--ok)}
.msg.ko{background:var(--kobg);color:#8e1b1b;border:2px solid var(--ko)}
.msg.info{background:var(--claro);border:2px solid var(--borde)}
.msg ul{margin:6px 0 0;padding-left:22px}
.op{font:inherit;font-size:19px;min-height:52px;padding:8px 16px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;text-align:left;color:var(--texto)}
.op:hover{background:#f8f1e8}
.op.bien{border-color:var(--ok);background:var(--okbg);font-weight:700}
.op.mal{border-color:var(--ko);background:var(--kobg)}
.op.quitada{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.opciones{display:flex;flex-direction:column;gap:10px}
.pregunta{border:2px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:12px}
.pregunta.ok{border-color:var(--ok)}
.pregunta>b{display:block;margin-bottom:8px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font:inherit;font-size:17px;border:2px solid #b9ad9f;background:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;color:var(--texto)}
.chip.vis{border-color:var(--ok);background:var(--okbg)}
.chip.sel{border-color:#ff8a00;background:#fff3e0;font-weight:700}
.chip code{font-size:17px}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:700px){.recs{grid-template-columns:1fr 1fr}}
.rec{font:inherit;font-size:18px;text-align:center;border:2px solid #b9ad9f;background:#fff;border-radius:12px;padding:12px;cursor:pointer;color:var(--texto)}
.rec.vis{border-color:var(--ok);background:var(--okbg)}
.rec b{display:block;color:var(--ok);font-size:15px}
.tarea{font-size:20px;font-weight:700;background:#fff3e0;border:2px solid #ff8a00;border-radius:10px;padding:8px 14px;margin:8px 0}
.nombre-pdf{font-family:Consolas,Menlo,monospace;font-size:20px;background:#f4f4f4;border:2px solid #bbb;border-radius:10px;padding:10px 14px;word-break:break-all;margin:10px 0}
input[type=text]{font:inherit;font-size:20px;min-height:52px;padding:8px 12px;border:2px solid #b9ad9f;border-radius:10px;width:100%}
.grande-ok{font-size:64px;text-align:center;margin:0}
.aprendido{background:var(--claro);border:2px solid var(--borde);border-radius:12px;padding:10px 16px;margin:12px 0}
.aprendido ul{margin:6px 0 0;padding-left:22px}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#sig.listo:not(:disabled){animation:pulso 1.2s ease-in-out infinite}
.conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:50;animation:cae 2.4s ease-in forwards}
@keyframes cae{to{transform:translateY(115vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){#sig.listo:not(:disabled){animation:none}.conf{display:none}}

/* ===== Ventana de Calc simulada ===== */
.calc{border:2px solid #9e9e9e;border-radius:8px;overflow:hidden;background:#fff;font-size:14px;line-height:1.3;position:relative;user-select:none;margin-top:6px}
.c-tit{background:#3c3c3c;color:#fff;padding:6px 10px;font-size:14px;display:flex;justify-content:space-between}
.c-menu{display:flex;flex-wrap:wrap;gap:2px;background:#f3f3f3;border-bottom:1px solid #ddd;padding:3px 4px}
.c-menu span{padding:3px 8px;border-radius:4px}
.c-tool{display:flex;gap:6px;background:#f9f9f9;border-bottom:1px solid #ddd;padding:5px 8px;color:#555}
.c-tool i{font-style:normal;border:1px solid #ccc;border-radius:4px;padding:1px 7px;background:#fff}
.c-tool i[data-desfes]{cursor:pointer}
.c-tool i[data-desfes]:hover{background:#d6e4f5}
.c-form{display:flex;gap:6px;align-items:center;padding:4px 6px;border-bottom:1px solid #ddd;background:#fafafa}
.c-nom{width:90px;border:1px solid #bbb;background:#fff;padding:2px 6px;font-family:Consolas,Menlo,monospace}
.c-fx{color:#555;font-style:italic}
.c-barra{flex:1;border:1px solid #bbb;background:#fff;padding:2px 6px;min-height:22px;font-family:Consolas,Menlo,monospace;white-space:nowrap;overflow:hidden}
.c-area table{border-collapse:collapse;table-layout:fixed;width:100%}
.c-area th{background:#efefef;border:1px solid #d0d0d0;font-weight:400;color:#444;font-size:12px;height:20px;position:relative}
.c-area th.esq{width:34px}
.c-area th.colsel{background:#d6e4f5}
.c-area td{border:1px solid #e3e3e3;height:24px;padding:0 4px;white-space:nowrap;overflow:hidden;position:relative;cursor:cell;font-size:14px}
.c-area td.num{text-align:right}
.c-area td.rng{background:#dbe8fb}
.c-area td.act{outline:2px solid #1e6fd9;outline-offset:-2px}
.c-area td.diana{background:#fff3e0}
.c-area td input{position:absolute;inset:0;width:100%;height:100%;border:2px solid #1e6fd9;font:inherit;font-size:14px;padding:0 3px;min-height:0;border-radius:0;background:#fff}
.asa{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;background:#1e6fd9;border:1px solid #fff;cursor:crosshair;z-index:2}
.asa.grande{width:13px;height:13px}
.borde{position:absolute;top:0;right:-5px;width:10px;height:100%;cursor:col-resize;z-index:3}
.borde.marca{background:repeating-linear-gradient(90deg,transparent 0 3px,#ff8a00 3px 6px,transparent 6px)}
.c-tabs{display:flex;align-items:flex-end;gap:2px;background:#ececec;border-top:1px solid #ccc;padding:4px 6px 0}
.c-tab{background:#dcdcdc;border:1px solid #bdbdbd;border-bottom:0;padding:4px 12px;border-radius:5px 5px 0 0;font-size:14px}
.c-tab.act{background:#fff;font-weight:700}
.c-estat{background:#f3f3f3;border-top:1px solid #ccc;padding:3px 10px;color:#555;font-size:13px;display:flex;justify-content:space-between}
.zona{cursor:pointer}
.zona.vis{box-shadow:inset 0 0 0 3px #2e7d32}
.zona.sel{box-shadow:inset 0 0 0 4px #ff8a00}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="titulo">🧮 Calc virtual</h1>
    <div class="prog"><span id="pasoTxt"></span><div class="barra-prog"><i id="barra"></i></div><span class="estrellas" id="est" title="Estrellas por acertar a la primera">⭐ 0</span></div>
  </header>
  <div class="aviso-sto" id="avisoSto" hidden>Tu navegador no deja guardar datos entre pantallas. No cierres esta página hasta descargar el resultado.</div>
  <div class="card" id="card"></div>
  <div class="nav">
    <button class="btn" id="atras">← Atrás</button>
    <button class="btn pri" id="sig">Siguiente →</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ===== almacenamiento compartido entre la práctica y la ficha ===== */
var KEY="s0402-ofimatica-v1", mem=null, stoOk=true;
function cargar(){
  var o=null;
  try{var s=localStorage.getItem(KEY);if(s)o=JSON.parse(s);}catch(e){stoOk=false;}
  if(!o)o=mem||{};
  o.alumno=o.alumno||""; o.practica=o.practica||{}; o.ficha=o.ficha||{}; o.err=o.err||{}; o.est=o.est||{}; o.fails=o.fails||{};
  return o;
}
function guardar(o){mem=o;try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){stoOk=false;$("avisoSto").hidden=false;}}
function upd(fn){var o=cargar();fn(o);guardar(o);}

/* ===== registro de tiempo activo y fallos por paso ===== */
var ULTACT=Date.now(),BUF={},NBUF=0;
function regO(o){o.reg=o.reg||{};["practica","ficha"].forEach(function(m){var r=o.reg[m]=o.reg[m]||{};r.t=r.t||{};r.f=r.f||{};r.ok=r.ok||{};r.ini=r.ini||"";});return o.reg;}
function regFallo(){var pp=paso;upd(function(o){var r=regO(o)[MODO];r.f[pp]=(r.f[pp]||0)+1;});}
function regOk(){var pp=paso;upd(function(o){var r=regO(o)[MODO];if(!r.ok[pp])r.ok[pp]=ahora();});}
function actividad(){ULTACT=Date.now();}
function volcarTiempo(){if(!NBUF)return;var b=BUF;BUF={};NBUF=0;upd(function(o){var r=regO(o)[MODO];if(!r.ini)r.ini=ahora();for(var k in b)r.t[k]=(r.t[k]||0)+b[k];});}
function tic(){if(document.hidden||Date.now()-ULTACT>120000)return;BUF[paso]=(BUF[paso]||0)+1;NBUF++;if(NBUF>=5)volcarTiempo();}
function mmss(x){x=Math.round(x||0);var m=Math.floor(x/60),s=x%60;return m+" min "+(s<10?"0":"")+s+" s";}
function recorrido(t,lista,modo,o){
  var r=regO(o)[modo],tt=0,ft=0;
  lista.forEach(function(p,k){tt+=r.t[k]||0;ft+=r.f[k]||0;});
  t("Inicio: "+(r.ini||"-")+" · Tiempo activo: "+mmss(tt)+" · Fallos: "+ft,10);
  lista.forEach(function(p,k){if(p.ultimo&&modo==="ficha")return;t(String(p.t).replace(/<[^>]*>/g,""),11,true,2,true);t("Tiempo: "+mmss(r.t[k])+" · Fallos: "+(r.f[k]||0)+" · "+(r.ok[k]?"Completado a las "+r.ok[k].slice(-5):"Sin completar"),10,false,4,true);});
}
function arrancarRegistro(){
  ["mousedown","keydown","mousemove","wheel","touchstart"].forEach(function(t){document.addEventListener(t,actividad,{passive:true});});
  setInterval(tic,1000);window.addEventListener("pagehide",volcarTiempo);document.addEventListener("visibilitychange",volcarTiempo);
}
function ahora(){var d=new Date(),z=function(n){return (n<10?"0":"")+n;};return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes());}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]/g,"");}
function nombrePDF(a,tipo){var p=a.trim().split(/\s+/).filter(Boolean);return p.length<2?null:"S04.02_"+(tipo||"Resultado")+"_"+norm(p[0])+"_"+norm(p.slice(1).join(""))+".pdf";}
function error(k){upd(function(o){o.err[k]=(o.err[k]||0)+1;});regFallo();}

/* ===== feedback positivo ===== */
var ELOGIOS=["¡Muy bien!","¡Genial!","¡Eso es!","¡Perfecto!","¡Buen trabajo!","¡Lo has clavado!","¡Excelente!"];
var ANIMOS=["¡Casi! Inténtalo otra vez.","¡Sin problema! Prueba de nuevo.","¡Ánimo, tú puedes!","Piénsalo un momento y vuelve a probar."];
function elogio(seed){return ELOGIOS[Math.abs(seed|0)%ELOGIOS.length];}
function animo(n){return ANIMOS[Math.abs(n|0)%ANIMOS.length];}
function semilla(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return Math.abs(h);}
function intento(clave,ok){upd(function(o){if(ok){if(!o.fails[clave])o.est[clave]=1;}else o.fails[clave]=(o.fails[clave]||0)+1;});}
function numEst(){return Object.keys(cargar().est).length;}
function confeti(){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  var em=["🎉","⭐","✨","🎊","🌟"];
  for(var i=0;i<22;i++){
    var d=document.createElement("span");d.className="conf";d.textContent=em[i%em.length];
    d.style.left=(Math.random()*96)+"vw";d.style.animationDelay=(Math.random()*0.6)+"s";d.style.fontSize=(22+Math.random()*16)+"px";
    document.body.appendChild(d);(function(x){setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x);},3200);})(d);
  }
}

/* ===== utilidades de hoja ===== */
var COLS=["A","B","C","D","E","F"];
function partir(ref){var m=/^([A-Z])(\d+)$/.exec(ref);return {c:COLS.indexOf(m[1]),f:+m[2]};}
function ref(c,f){return COLS[c]+f;}
function rango(a,b){var x=partir(a),y=partir(b),r=[];for(var f=Math.min(x.f,y.f);f<=Math.max(x.f,y.f);f++)for(var c=Math.min(x.c,y.c);c<=Math.max(x.c,y.c);c++)r.push(ref(c,f));return r;}
function txtRango(a,b){return a===b?a:(rango(a,b)[0]+":"+rango(a,b).slice(-1)[0]);}
/* número escrito como en Calc en valenciano/castellano: coma decimal */
function esNum(v){return /^-?\d+(,\d+)?$/.test(String(v).trim());}
function valNum(v){return parseFloat(String(v).trim().replace(",","."));}
function simple(s){return String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ");}

var PRODUCTOS=[
 ["Agua","Bebida","1","24"],["Zumo de naranja","Bebida","1,5","18"],["Refresco de cola","Bebida","1,2","24"],["Batido de cacao","Bebida","1","12"],
 ["Bocadillo de tortilla","Bocadillo","2,5","15"],["Bocadillo de jamón","Bocadillo","2,5","15"],["Sándwich vegetal","Bocadillo","2","10"],
 ["Manzana","Fruta","0,5","25"],["Galletas","Snack","0,8","20"],["Barrita de cereales","Snack","0,7","20"]
];
var CABECERAS=["Nº","Producto","Categoría","Precio de venta","Existencias"];

/* ===== estado en memoria ===== */
var S={
  p1:{tarea:0,a:"A1",b:"A1",msg:"",ok:false},
  p2:{sel:null,rec:null,done:{},msg:"",ok:false},
  p3:{cel:{},a:"A1",ed:null,msg:"",ok:false,hecho:false},
  p4:{cel:{},a:"A2",b:"A2",tarea:0,arr:false,msg:"",ok:false},
  p5:{cel:{},ancho:false,borrado:false,hecho:false,msg:"",ok:false}
};
(function iniciar(){
  var c4=S.p4.cel, c5=S.p5.cel;
  CABECERAS.forEach(function(h,i){c4[ref(i,1)]=h;c5[ref(i,1)]=h;});
  PRODUCTOS.forEach(function(p,i){var f=i+2;c4["B"+f]=p[0];c4["D"+f]=p[2];c4["E"+f]=p[3];
    c5["A"+f]=String(i+1);c5["B"+f]=p[0];c5["C"+f]=p[1];c5["D"+f]=p[2];c5["E"+f]=p[3];});
  c4.A2="1";c4.A3="2";c4.C2="Bebida";
  PRODUCTOS.forEach(function(p,i){if(i>=4)c4["C"+(i+2)]=p[1];});
})();
var paso=0;
var MODO=((location.hash||"").toLowerCase()==="#ficha")?"ficha":"practica";

/* ===== ventana de Calc =====
   op: cel (contenidos), a/b (selección), filas, anchos, ed (celda en edición), asa, diana, bordeB, estrecha, zonas */
var MENUS=["Fitxer","Edita","Visualitza","Insereix","Format","Estils","Full","Dades","Eines","Finestra","Ajuda"];
function calc(op){
  var cel=op.cel||{}, a=op.a||"A1", b=op.b||a, filas=op.filas||7, sel=rango(a,b), act=a;
  var anchos=op.anchos||[60,150,110,120,100,80];
  var h='<div class="calc">';
  h+='<div class="c-tit"><span>Kiosco_FPB.ods — LibreOffice Calc</span><span>— ▢ ✕</span></div>';
  h+='<div class="c-menu">'+MENUS.map(function(m){return '<span>'+m+'</span>';}).join("")+'</div>';
  h+='<div class="c-tool"><i>💾</i><i data-desfes="1" title="Desfés (Ctrl+Z)">↶</i><i>↷</i><i>📋</i><i>𝐍</i><i>𝐼</i><i>€</i><i>%</i><i>Σ</i></div>';
  h+='<div class="c-form"><span class="c-nom">'+esc(txtRango(a,b))+'</span><span class="c-fx">ƒx Σ =</span><span class="c-barra">'+esc(cel[act]||"")+'</span></div>';
  h+='<div class="c-area"><table><colgroup><col style="width:34px">'+anchos.map(function(w){return '<col style="width:'+w+'px">';}).join("")+'</colgroup><tr><th class="esq"></th>';
  COLS.forEach(function(c){h+='<th class="'+(sel.some(function(r){return r.charAt(0)===c;})?"colsel":"")+'">'+c+(op.bordeB&&c==="B"?'<span class="borde'+(op.marcaBorde?" marca":"")+'" data-borde="B" title="Doble clic para ajustar el ancho"></span>':"")+'</th>';});
  h+='</tr>';
  for(var f=1;f<=filas;f++){
    h+='<tr><th>'+f+'</th>';
    COLS.forEach(function(c){
      var r=c+f, v=cel[r]||"", cls=[];
      if(esNum(v))cls.push("num");
      if(sel.length>1&&sel.indexOf(r)>=0)cls.push("rng");
      if(r===act)cls.push("act");
      if(op.diana&&op.diana.indexOf(r)>=0)cls.push("diana");
      var dentro=op.ed===r?'<input type="text" id="celdaEd" value="'+esc(op.edVal||"")+'" autocomplete="off">':esc(v);
      if(op.asa&&r===sel[sel.length-1])dentro+='<span class="asa grande" data-asa="1" title="Controlador de relleno"></span>';
      h+='<td data-c="'+r+'" class="'+cls.join(" ")+'">'+dentro+'</td>';
    });
    h+='</tr>';
  }
  h+='</table></div>';
  h+='<div class="c-tabs"><span class="c-tab act">Productos</span><span class="c-tab">Compras</span><span class="c-tab">Ventas</span><span class="c-tab">Resumen</span></div>';
  h+='<div class="c-estat"><span>Full 1 de 4</span><span>100 %</span></div>';
  return h+'</div>';
}
function msg(m,ok){return m?'<div class="msg '+(ok?"ok":"ko")+'">'+m+'</div>':"";}

/* ===== PRÁCTICA ===== */
var TAREAS1=[
 {t:"Pulsa la celda C4",tipo:"celda",obj:"C4"},
 {t:"Pulsa la celda E2",tipo:"celda",obj:"E2"},
 {t:"Selecciona el rango A2:A6 (pulsa A2 y después Mayús + clic en A6)",tipo:"rango",obj:"A2:A6"}
];
var TIPOS=[
 ["texto","Agua","Texto"],["numero","24","Número"],["decimal","1,50","Número decimal"],
 ["fecha","20/11/2026","Fecha"],["porcentaje","10 %","Porcentaje"],["formula","=D2*F2","Fórmula"]
];
var ORDEN_TIPOS=["fecha","formula","texto","porcentaje","decimal","numero"];
var OBJ3={A1:"Nº",B1:"Producto",C1:"Categoría",D1:"Precio de venta",E1:"Existencias",
          A2:"1",B2:"Agua",C2:"Bebida",D2:"1",E2:"24",A3:"2",B3:"Zumo de naranja",C3:"Bebida",D3:"1,5",E3:"18"};
var ORDEN3=["A1","B1","C1","D1","E1","A2","B2","C2","D2","E2","A3","B3","C3","D3","E3"];

var PRACTICA=[

function comprobar3(){
  var p=S.p3, prob=[];
  ORDEN3.forEach(function(r){
    var esp=OBJ3[r], v=p.cel[r];
    if(v===undefined){
      var donde=Object.keys(p.cel).filter(function(k){return simple(p.cel[k])===simple(esp)&&!OBJ3[k];})[0];
      prob.push(donde?"<b>«"+esc(esp)+"»</b> está en "+donde+", pero va en <b>"+r+"</b>.":"Falta <b>"+r+"</b>: «"+esc(esp)+"».");return;}
    if(esNum(esp)){
      if(/^\d+\.\d+$/.test(v))prob.push("<b>"+r+"</b>: «"+esc(v)+"» está escrito con <b>punto</b>. Calc lo toma como texto (se queda a la izquierda). Escribe <b>"+v.replace(".",",")+"</b>.");
      else if(!esNum(v))prob.push("<b>"+r+"</b>: aquí va un número («"+esc(esp)+"»), pero has escrito «"+esc(v)+"».");
      else if(valNum(v)!==valNum(esp))prob.push("<b>"+r+"</b>: el valor es <b>"+esp.replace(/^1$/,"1")+"</b>, no "+esc(v)+".");
    }else if(r==="A1"){if(!/^n(º|°|o|\.|um|úm)?\.?$/i.test(v.trim()))prob.push("<b>A1</b>: el encabezado es <b>Nº</b>.");}
    else if(simple(v)!==simple(esp))prob.push("<b>"+r+"</b>: debería ser «"+esc(esp)+"» y has escrito «"+esc(v)+"».");
  });
  Object.keys(p.cel).forEach(function(k){if(!OBJ3[k])prob.push("<b>"+k+"</b> debería estar vacía.");});
  if(prob.length){intento("catalogo",false);error("catalogo");p.msg="Revisa estos datos:<ul><li>"+prob.slice(0,5).join("</li><li>")+"</li></ul>"+(prob.length>5?"…y "+(prob.length-5)+" más.":"");p.ok=false;}
  else{intento("catalogo",true);p.hecho=true;p.msg="✔ <b>¡Muy bien!</b> Los encabezados y los dos productos están en su sitio. Fíjate: los números se alinean a la derecha y el texto a la izquierda.";p.ok=true;}
}

function rellenar4(destino){
  var p=S.p4, sel=rango(p.a,p.b), ini=partir(sel[0]), fin=partir(sel[sel.length-1]), d=partir(destino);

    if(d.c!==0){p.msg="Arrastra hacia <b>abajo</b>, por la misma columna A.";p.ok=false;error("relleno");intento("serie",false);return;}

  for(var g=2;g<=5;g++)p.cel["C"+g]="Bebida";
  intento("copia",true);p.tarea=2;p.msg="✔ <b>¡Perfecto!</b> Con texto, el controlador de relleno <b>copia</b> el dato: «Bebida» en las cuatro bebidas.";p.ok=true;
}

  p.borrado=true;p.msg="✔ <b>¡Bien!</b> La columna B se ha ajustado y ya se lee «Bocadillo de tortilla».";p.ok=true;
}
function deshacer5(){
  var p=S.p5; if(!p.borrado)return;
  Object.keys(PRECIOS).forEach(function(k){p.cel[k]=PRECIOS[k];});
  p.borrado=false;p.hecho=true;intento("deshacer",true);
  upd(function(o){o.practica={ok:true,t:ahora(),catalogo:JSON.parse(JSON.stringify(S.p3.cel))};});
}

/* ===== eventos ===== */
var ULT={r:"",t:0};
function alClic(e){
  var t=e.target;
  if(MODO==="practica"){
    if(t.closest("[data-borde]"))return; /* el borde solo reacciona al doble clic */
    if(t.closest("[data-desfes]")){if(paso===4){if(S.p5.borrado)deshacer5();else{S.p5.msg="Todavía no hay nada que deshacer.";S.p5.ok=false;}render();}return;}
    if(t.closest("[data-asa]")&&paso===3){S.p4.arr=true;S.p4.msg="";render();return;}
    var td=t.closest("td[data-c]");
    if(td&&!t.closest("#celdaEd")){
      var r=td.getAttribute("data-c");
      if(paso===0){clicCelda1(r,e.shiftKey);render();return;}
      if(paso===2){ /* doble clic (detectado a mano: cada clic vuelve a pintar la tabla) = editar la celda */
        var ahoraMs=Date.now(), doble=ULT.r===r&&ahoraMs-ULT.t<450; ULT={r:r,t:ahoraMs};
        if(S.p3.ed)confirmar3(null);
        if(doble&&S.p3.a===r){S.p3.ed=r;S.p3.edVal=S.p3.cel[r]||"";render();return;}
        S.p3.a=r;render();return;}
      if(paso===3){var p4=S.p4;
        if(p4.arr){rellenar4(r);render();return;}
        if(e.shiftKey)p4.b=r; else {p4.a=r;p4.b=r;}
        p4.msg="";render();return;}
      if(paso===4){S.p5.msg=S.p5.ancho?"":"Para ajustar el ancho, haz <b>doble clic</b> en el borde naranja entre B y C.";S.p5.ok=false;render();return;}
    }
  }
  var b=t.closest("[data-act]"); if(!b)return;
  var act=b.getAttribute("data-act");
  if(act==="p2-dato"){var r2=S.p2,v=b.getAttribute("data-v");if(r2.done[v]){r2.msg="✔ Ese dato ya está unido.";r2.ok=true;}else{r2.sel=v;r2.msg=r2.rec?"":"👆 Ahora pulsa su tipo.";r2.ok=false;unir2();}}
  else if(act==="p2-tipo"){var r2b=S.p2,v2=b.getAttribute("data-v");if(r2b.done[v2]){r2b.msg="✔ Ese tipo ya está unido.";r2b.ok=true;}else{r2b.rec=v2;if(!r2b.sel){r2b.msg="👆 Ahora pulsa el dato.";r2b.ok=false;}else unir2();}}
  else if(act==="p3-comprobar"){if(S.p3.ed)confirmar3(null);comprobar3();}
  else if(act==="resp"){
    var sec=b.getAttribute("data-sec"),i=b.getAttribute("data-i"),vv=+b.getAttribute("data-v"),corr=LISTAS[sec][i][2];
    if(vv!==corr)error(sec);
    intento(sec+i,vv===corr);
    upd(function(o){(o.ficha[sec]=o.ficha[sec]||{})[i]=vv;});
  }
  else if(act==="descargar-p"){descargaPDF("Practica");return;}
  else if(act==="descargar"){descargaPDF();return;}
  render();
}
function alDobleClic(e){
  if(MODO==="practica"&&paso===4&&e.target.closest("[data-borde]")){ajustar5();render();}
}
function alTecla(e){if(e.target&&e.target.id==="inNombre")return;
  if(MODO!=="practica")return;
  if(paso===4&&(e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z")){e.preventDefault();if(S.p5.borrado){deshacer5();render();}return;}
  if(paso!==2)return;
  var p=S.p3;
  if(e.target.id==="celdaEd"){
    if(e.key==="Enter"){e.preventDefault();p.edVal=e.target.value;confirmar3("abajo");render();}
    else if(e.key==="Tab"){e.preventDefault();p.edVal=e.target.value;confirmar3("derecha");render();}
    else if(e.key==="Escape"){p.ed=null;render();}
    return;
  }
  if(e.target.tagName==="INPUT"||e.ctrlKey||e.altKey||e.metaKey)return;
  if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();delete p.cel[p.a];render();return;}
  if(e.key==="F2"){e.preventDefault();p.ed=p.a;p.edVal=p.cel[p.a]||"";render();return;}
  if(e.key&&e.key.length===1){e.preventDefault();p.ed=p.a;p.edVal=e.key;render();}
}
function alEscribir(e){
  if(e.target.id==="celdaEd"){S.p3.edVal=e.target.value;return;}
  if(e.target.id!=="inNombre")return;
  var v=e.target.value;upd(function(o){o.alumno=v;});
  var tp=MODO==="ficha"?"Resultado":"Practica";var f=nombrePDF(v,tp);$("nomPdf").textContent=f||"S04.02_"+tp+"_Nombre_Apellido.pdf";
  var bt=$("btnDescarga");if(bt)bt.disabled=!f;
}

/* ===== PDF de resultado ===== */
function cp1252(s){
  var map={"—":"\x97","–":"\x96","“":"\x93","”":"\x94","‘":"\x91","’":"\x92","•":"\x95","…":"\x85","€":"\x80","→":"->","›":">","✔":"[x]","✖":"[ ]","−":"-"};
  s=String(s).normalize("NFC");var out="";
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i),c=ch.charCodeAt(0);
    if(map.hasOwnProperty(ch))out+=map[ch];
    else if(c>=0xD800&&c<=0xDFFF){}
    else if(c<32)out+=" ";
    else if(c<127||(c>=160&&c<256))out+=ch;
    else out+="?";
  }
  return out;
}
function pdfEsc(s){return s.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");}
function envolver(texto,size,sangria){
  var max=Math.floor(495/(0.53*size))-(sangria||0),pal=cp1252(texto).split(" "),l=[],act="";
  pal.forEach(function(w){
    while(w.length>max){if(act){l.push(act);act="";}l.push(w.slice(0,max));w=w.slice(max);}
    if((act+" "+w).trim().length>max){l.push(act);act=w;}else act=(act?act+" ":"")+w;
  });
  l.push(act);return l;
}
function construyePDF(lineas){
  var pags=[[]],y=792,M=50;
  lineas.forEach(function(L){
    var size=L.s||11,lh=size*1.4,sang=L.i||0;
    var partes=L.t===""?[""]:envolver(L.t,size,sang);
    partes.forEach(function(txt,idx){
      if(y-lh<M){pags.push([]);y=792;}
      y-=lh;
      pags[pags.length-1].push("BT /"+(L.b?"F2":"F1")+" "+size+" Tf "+(M+sang*size*0.53+(idx&&L.h?size*1.2:0)).toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(txt)+") Tj ET");
    });
  });
  var n=pags.length,total=4+n*2;
  var lista=[null,"<< /Type /Catalog /Pages 2 0 R >>",null,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
  var kids=[];
  pags.forEach(function(p,i){
    var idc=5+i*2,idp=6+i*2,cont=p.join("\n");
    lista[idc]="<< /Length "+cont.length+" >>\nstream\n"+cont+"\nendstream";
    lista[idp]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+idc+" 0 R >>";
    kids.push(idp+" 0 R");
  });
  lista[2]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>";
  var pdf="%PDF-1.4\n",offs=[];
  for(var k=1;k<=total;k++){offs[k]=pdf.length;pdf+=k+" 0 obj\n"+lista[k]+"\nendobj\n";}
  var xref=pdf.length;
  pdf+="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(var q=1;q<=total;q++)pdf+=("0000000000"+offs[q]).slice(-10)+" 00000 n \n";
  pdf+="trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  var bytes=new Uint8Array(pdf.length);
  for(var b=0;b<pdf.length;b++)bytes[b]=pdf.charCodeAt(b)&255;
  return bytes;
}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ("00000000"+(h>>>0).toString(16)).slice(-8).toUpperCase();}
function informe(o){
  var L=[],canon=[],F=o.ficha,pr=o.practica;

  t("Alumno/a: "+o.alumno.trim(),12,true);
  t("Fecha: "+ahora(),11);t("Estrellas conseguidas: "+Object.keys(o.est).length,11);t("");

  t("Fallos con celdas y rangos: "+(o.err.celdas||0),10,false,2,true);

  t("");
  t("2. Ficha de respuestas",12,true);
  function sec(id,titulo,lst){
    var ac=0;lst.forEach(function(q,i){var v=(F[id]||{})[i];if(v!==undefined&&+v===q[2])ac++;});
    t(titulo+" ("+ac+"/"+lst.length+" correctas)",11,true);
    lst.forEach(function(q,i){var v=(F[id]||{})[i];t("- "+q[0]+" -> "+(v===undefined?"(sin responder)":q[1][v]),11,false,2,true);});
    t("Intentos fallidos: "+(o.err[id]||0),10);t("");
  }
  sec("f1","Celdas y rangos",F1);
  sec("f2","Tipos de datos",F2);
  sec("f3","El controlador de relleno",F3);

  t("");
  t("Tiempo en la ficha",12,true);recorrido(t,FICHA,"ficha",o);t("");
  t("Código de comprobación: "+hash(canon.join("|")),9,true);
  return L;
}

function descargaPDF(tipo){volcarTiempo();
  var o=cargar(),f=nombrePDF(o.alumno,tipo);

}
