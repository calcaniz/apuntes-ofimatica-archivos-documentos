<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calc virtual · S04.04</title>
<style>
:root{
  --principal:#ff9944; --secundario:#81501c; --claro:#fdf4e9; --borde:#d9c9b6;
  --ok:#2e7d32; --okbg:#e8f5e9; --ko:#c62828; --kobg:#fdecea; --texto:#2b2118; --gris:#6b6258;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:#fff;font-size:19px;line-height:1.45;overflow-x:hidden}
.app{max-width:980px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--secundario);color:#fff;padding:12px 16px}
header h1{font-size:19px;margin:0 0 8px;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;font-size:16px}
.barra-prog{flex:1;height:12px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--principal);border-radius:99px;transition:width .3s}
.estrellas{font-weight:700;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 12px;white-space:nowrap}
.aviso-sto{background:#fff3cd;border-bottom:1px solid #e0b100;color:#5a4300;padding:6px 14px;font-size:15px}
.card{flex:1;padding:18px 16px}
.card h2{font-size:26px;margin:0 0 6px;color:var(--secundario)}
.ayuda{font-size:19px;margin:0 0 16px;background:var(--claro);border-left:6px solid var(--principal);padding:10px 14px;border-radius:6px}
.btn{font:inherit;font-size:20px;min-height:54px;padding:10px 22px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;color:var(--texto)}
.btn:hover{background:#f8f1e8}
.btn.pri{background:var(--principal);border-color:var(--secundario);color:#2b1a05;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.grande{font-size:22px;padding:14px 28px}
.nav{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:2px solid var(--borde);background:#faf7f3;position:sticky;bottom:0}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:19px}
.msg.ok{background:var(--okbg);color:#1b5e20;border:2px solid var(--ok)}
.msg.ko{background:var(--kobg);color:#8e1b1b;border:2px solid var(--ko)}
.msg.info{background:var(--claro);border:2px solid var(--borde)}
.op{font:inherit;font-size:19px;min-height:52px;padding:8px 16px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;text-align:left;color:var(--texto)}
.op:hover{background:#f8f1e8}
.op.bien{border-color:var(--ok);background:var(--okbg);font-weight:700}
.op.mal{border-color:var(--ko);background:var(--kobg)}
.op.quitada{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.opciones{display:flex;flex-direction:column;gap:10px}
.pregunta{border:2px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:12px}
.pregunta.ok{border-color:var(--ok)}
.pregunta>b{display:block;margin-bottom:8px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font:inherit;font-size:17px;border:2px solid #b9ad9f;background:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;color:var(--texto)}
.chip.vis{border-color:var(--ok);background:var(--okbg)}
.chip.sel{border-color:#ff8a00;background:#fff3e0;font-weight:700}
.recs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:760px){.recs{grid-template-columns:repeat(2,1fr)}}
.rec{font:inherit;font-size:20px;font-family:Consolas,Menlo,monospace;text-align:center;border:2px solid #b9ad9f;background:#fff;border-radius:12px;padding:14px 6px;cursor:pointer;color:var(--texto)}
.rec.vis{border-color:var(--ok);background:var(--okbg)}
.rec b{display:block;color:var(--ok);font-size:14px;font-family:system-ui,sans-serif}
.tarea{font-size:20px;font-weight:700;background:#fff3e0;border:2px solid #ff8a00;border-radius:10px;padding:8px 14px;margin:8px 0}
.nombre-pdf{font-family:Consolas,Menlo,monospace;font-size:20px;background:#f4f4f4;border:2px solid #bbb;border-radius:10px;padding:10px 14px;word-break:break-all;margin:10px 0}
input[type=text]{font:inherit;font-size:20px;min-height:52px;padding:8px 12px;border:2px solid #b9ad9f;border-radius:10px;width:100%}
.grande-ok{font-size:64px;text-align:center;margin:0}
.aprendido{background:var(--claro);border:2px solid var(--borde);border-radius:12px;padding:10px 16px;margin:12px 0}
.aprendido ul{margin:6px 0 0;padding-left:22px}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#sig.listo:not(:disabled){animation:pulso 1.2s ease-in-out infinite}
.conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:50;animation:cae 2.4s ease-in forwards}
@keyframes cae{to{transform:translateY(115vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){#sig.listo:not(:disabled){animation:none}.conf{display:none}}

/* ===== Ventana de Calc simulada ===== */
.calc{border:2px solid #9e9e9e;border-radius:8px;overflow:hidden;background:#fff;font-size:14px;line-height:1.3;position:relative;user-select:none;margin-top:6px}
.c-tit{background:#3c3c3c;color:#fff;padding:6px 10px;font-size:14px;display:flex;justify-content:space-between}
.c-menu{display:flex;flex-wrap:wrap;gap:2px;background:#f3f3f3;border-bottom:1px solid #ddd;padding:3px 4px}
.c-menu span{padding:3px 8px;border-radius:4px}
.c-menu span[data-menu]{cursor:pointer}
.c-menu span[data-menu]:hover,.c-menu span.abierto{background:#d6e4f5}
.c-tool{display:flex;gap:5px;background:#f9f9f9;border-bottom:1px solid #ddd;padding:5px 8px;color:#555;flex-wrap:wrap;position:relative}
.c-tool i{font-style:normal;border:1px solid #ccc;border-radius:4px;padding:1px 8px;background:#fff;min-width:28px;text-align:center}
.c-tool i[data-b]{cursor:pointer}
.c-tool i[data-b]:hover{background:#d6e4f5}
.c-tool i.on{background:#cfe0f7;border-color:#1e6fd9}
.c-tool .sep{border:0;background:none;padding:0;min-width:6px}
.c-form{display:flex;gap:6px;align-items:center;padding:4px 6px;border-bottom:1px solid #ddd;background:#fafafa}
.c-nom{width:90px;border:1px solid #bbb;background:#fff;padding:2px 6px;font-family:Consolas,Menlo,monospace}
.c-fx{color:#555;font-style:italic}
.c-barra{flex:1;border:1px solid #bbb;background:#fff;padding:2px 6px;min-height:22px;font-family:Consolas,Menlo,monospace;white-space:nowrap;overflow:hidden}
.c-area table{border-collapse:collapse;table-layout:fixed;width:100%}
.c-area th{background:#efefef;border:1px solid #d0d0d0;font-weight:400;color:#444;font-size:12px;height:20px}
.c-area th.esq{width:30px}
.c-area td{border:1px solid #e9e9e9;height:24px;padding:0 4px;white-space:nowrap;overflow:hidden;font-size:14px;cursor:cell}
.c-area td.num{text-align:right}
.c-area td.neg{font-weight:700}
.c-area td.cen{text-align:center}
.c-area td.vor{border:1px solid #333}
.c-area td.rng{box-shadow:inset 0 0 0 999px rgba(30,111,217,.16)}
.c-area td.act{outline:2px solid #1e6fd9;outline-offset:-2px}
.c-tabs{display:flex;align-items:flex-end;gap:2px;background:#ececec;border-top:1px solid #ccc;padding:4px 6px 0}
.c-tab{background:#dcdcdc;border:1px solid #bdbdbd;border-bottom:0;padding:4px 12px;border-radius:5px 5px 0 0;font-size:14px}
.c-tab[data-full]{cursor:pointer}
.c-tab.act{background:#fff;font-weight:700}
.c-estat{background:#f3f3f3;border-top:1px solid #ccc;padding:3px 10px;color:#555;font-size:13px;display:flex;justify-content:space-between}
.clonando td{cursor:copy}
.desp{position:absolute;background:#fff;border:1px solid #9e9e9e;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5;min-width:200px;padding:4px 0;font-size:15px}
.desp div{padding:6px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:18px}
.desp div:hover{background:#d6e4f5}
.desp small{color:#777}
.paleta{position:absolute;z-index:5;background:#fff;border:1px solid #999;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:8px;display:grid;grid-template-columns:repeat(4,30px);gap:6px}
.paleta span{width:30px;height:24px;border:1px solid #888;cursor:pointer;border-radius:3px}
.vores{position:absolute;z-index:5;background:#fff;border:1px solid #999;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:8px;display:grid;grid-template-columns:repeat(4,44px);gap:6px}
.vores span{width:44px;height:36px;cursor:pointer;border:1px solid #bbb;border-radius:4px;display:flex;align-items:center;justify-content:center;background:#fff}
.vores span:hover{background:#d6e4f5}
.vores svg{width:28px;height:28px}
.dialeg{position:absolute;left:50%;top:56px;transform:translateX(-50%);width:min(94%,560px);background:#f7f7f7;border:1px solid #888;box-shadow:0 6px 22px rgba(0,0,0,.35);z-index:6;border-radius:6px;overflow:hidden;font-size:15px}
.dialeg .dt{background:#3c3c3c;color:#fff;padding:6px 10px}
.dialeg .dc{padding:12px}
.dialeg .db{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.dialeg .db button{font:inherit;font-size:15px;padding:6px 16px;border:1px solid #888;border-radius:4px;background:#fff;cursor:pointer}
.dialeg .db button.p{background:#1e6fd9;color:#fff;border-color:#1556a8}
.pest{display:flex;gap:2px;border-bottom:1px solid #aaa;margin-bottom:8px;flex-wrap:wrap}
.pest span{padding:4px 10px;border:1px solid #bbb;border-bottom:0;border-radius:4px 4px 0 0;background:#e9e9e9;font-size:14px}
.pest span.act{background:#fff;font-weight:700}
.llista{border:1px solid #999;background:#fff;max-height:310px;overflow:auto}
.llista div{padding:4px 10px;cursor:pointer}
.llista div:hover{background:#eef4fc}
.llista div.sel{background:#1e6fd9;color:#fff}
.mostra{margin-top:8px;font-size:14px;color:#444}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="titulo">🧮 Calc virtual</h1>
    <div class="prog"><span id="pasoTxt"></span><div class="barra-prog"><i id="barra"></i></div><span class="estrellas" id="est" title="Estrellas por acertar a la primera">⭐ 0</span></div>
  </header>
  <div class="aviso-sto" id="avisoSto" hidden>Tu navegador no deja guardar datos entre pantallas. No cierres esta página hasta descargar el resultado.</div>
  <div class="card" id="card"></div>
  <div class="nav">
    <button class="btn" id="atras">← Atrás</button>
    <button class="btn pri" id="sig">Siguiente →</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ===== almacenamiento compartido entre la práctica y la ficha ===== */
var KEY="s0404-ofimatica-v1", mem=null, stoOk=true;
function cargar(){
  var o=null;
  try{var s=localStorage.getItem(KEY);if(s)o=JSON.parse(s);}catch(e){stoOk=false;}
  if(!o)o=mem||{};
  o.alumno=o.alumno||""; o.practica=o.practica||{}; o.ficha=o.ficha||{}; o.err=o.err||{}; o.est=o.est||{}; o.fails=o.fails||{};
  return o;
}
function guardar(o){mem=o;try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){stoOk=false;$("avisoSto").hidden=false;}}
function upd(fn){var o=cargar();fn(o);guardar(o);}

/* ===== registro de tiempo activo y fallos por paso ===== */
var ULTACT=Date.now(),BUF={},NBUF=0;
function regO(o){o.reg=o.reg||{};["practica","ficha"].forEach(function(m){var r=o.reg[m]=o.reg[m]||{};r.t=r.t||{};r.f=r.f||{};r.ok=r.ok||{};r.ini=r.ini||"";});return o.reg;}
function regFallo(){var pp=paso;upd(function(o){var r=regO(o)[MODO];r.f[pp]=(r.f[pp]||0)+1;});}
function regOk(){var pp=paso;upd(function(o){var r=regO(o)[MODO];if(!r.ok[pp])r.ok[pp]=ahora();});}
function actividad(){ULTACT=Date.now();}
function volcarTiempo(){if(!NBUF)return;var b=BUF;BUF={};NBUF=0;upd(function(o){var r=regO(o)[MODO];if(!r.ini)r.ini=ahora();for(var k in b)r.t[k]=(r.t[k]||0)+b[k];});}
function tic(){if(document.hidden||Date.now()-ULTACT>120000)return;BUF[paso]=(BUF[paso]||0)+1;NBUF++;if(NBUF>=5)volcarTiempo();}
function mmss(x){x=Math.round(x||0);var m=Math.floor(x/60),s=x%60;return m+" min "+(s<10?"0":"")+s+" s";}
function recorrido(t,lista,modo,o){
  var r=regO(o)[modo],tt=0,ft=0;
  lista.forEach(function(p,k){tt+=r.t[k]||0;ft+=r.f[k]||0;});
  t("Inicio: "+(r.ini||"-")+" · Tiempo activo: "+mmss(tt)+" · Fallos: "+ft,10);
  lista.forEach(function(p,k){if(p.ultimo&&modo==="ficha")return;t(String(p.t).replace(/<[^>]*>/g,""),11,true,2,true);t("Tiempo: "+mmss(r.t[k])+" · Fallos: "+(r.f[k]||0)+" · "+(r.ok[k]?"Completado a las "+r.ok[k].slice(-5):"Sin completar"),10,false,4,true);});
}
function arrancarRegistro(){
  ["mousedown","keydown","mousemove","wheel","touchstart"].forEach(function(t){document.addEventListener(t,actividad,{passive:true});});
  setInterval(tic,1000);window.addEventListener("pagehide",volcarTiempo);document.addEventListener("visibilitychange",volcarTiempo);
}
function ahora(){var d=new Date(),z=function(n){return (n<10?"0":"")+n;};return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes());}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]/g,"");}
function nombrePDF(a,tipo){var p=a.trim().split(/\s+/).filter(Boolean);return p.length<2?null:"S04.04_"+(tipo||"Resultado")+"_"+norm(p[0])+"_"+norm(p.slice(1).join(""))+".pdf";}
function error(k){upd(function(o){o.err[k]=(o.err[k]||0)+1;});regFallo();}

/* ===== feedback positivo ===== */
var ELOGIOS=["¡Muy bien!","¡Genial!","¡Eso es!","¡Perfecto!","¡Buen trabajo!","¡Lo has clavado!","¡Excelente!"];
var ANIMOS=["¡Casi! Inténtalo otra vez.","¡Sin problema! Prueba de nuevo.","¡Ánimo, tú puedes!","Piénsalo un momento y vuelve a probar."];
function elogio(seed){return ELOGIOS[Math.abs(seed|0)%ELOGIOS.length];}
function animo(n){return ANIMOS[Math.abs(n|0)%ANIMOS.length];}
function semilla(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return Math.abs(h);}
function intento(clave,ok){upd(function(o){if(ok){if(!o.fails[clave])o.est[clave]=1;}else o.fails[clave]=(o.fails[clave]||0)+1;});}
function numEst(){return Object.keys(cargar().est).length;}
function confeti(){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  var em=["🎉","⭐","✨","🎊","🌟"];
  for(var i=0;i<22;i++){
    var d=document.createElement("span");d.className="conf";d.textContent=em[i%em.length];
    d.style.left=(Math.random()*96)+"vw";d.style.animationDelay=(Math.random()*0.6)+"s";d.style.fontSize=(22+Math.random()*16)+"px";
    document.body.appendChild(d);(function(x){setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x);},3200);})(d);
  }
}

/* ===== hoja ===== */
var COLS=["A","B","C","D","E","F","G"];
function partir(r){var m=/^([A-Z])(\d+)$/.exec(r);return {c:COLS.indexOf(m[1]),f:+m[2]};}
function ref(c,f){return COLS[c]+f;}
function rango(a,b){var x=partir(a),y=partir(b),r=[];for(var f=Math.min(x.f,y.f);f<=Math.max(x.f,y.f);f++)for(var c=Math.min(x.c,y.c);c<=Math.max(x.c,y.c);c++)r.push(ref(c,f));return r;}
function txtRango(a,b){var r=rango(a,b);return r.length===1?r[0]:r[0]+":"+r[r.length-1];}
function esNum(v){return /^-?\d+(,\d+)?$/.test(String(v).trim());}
function valNum(v){return parseFloat(String(v).trim().replace(",","."));}
function moneda(v){var n=valNum(v);return n.toFixed(2).replace(".",",")+" €";}

var PRODUCTOS=[["Agua","Bebida","1","24","8410001000011","0,4"],["Zumo de naranja","Bebida","1,5","18","8410001000028","0,8"],["Refresco de cola","Bebida","1,2","24","0480001000035","0,6"],
 ["Batido de cacao","Bebida","1","12","8410001000042","0,5"],["Bocadillo de tortilla","Bocadillo","2,5","15","KIO-005","1,2"],["Bocadillo de jamón","Bocadillo","2,5","15","KIO-006","1,3"],
 ["Sándwich vegetal","Bocadillo","2","10","KIO-007","1"],["Manzana","Fruta","0,5","25","KIO-008","0,25"],["Galletas","Snack","0,8","20","8410001000097","0,4"],["Barrita de cereales","Snack","0,7","20","0480001000103","0,35"]];
function hojaProductos(){
  var c={A1:"Nº",B1:"Producto",C1:"Categoría",D1:"Precio de venta",E1:"Existencias",F1:"Código",G1:"Precio de compra"};
  PRODUCTOS.forEach(function(p,i){var f=i+2;c["A"+f]=String(i+1);c["B"+f]=p[0];c["C"+f]=p[1];c["D"+f]=p[2];c["E"+f]=p[3];c["F"+f]=p[4];c["G"+f]=p[5];});
  return c;
}
function hojaCompras(){var c={A1:"Producto",B1:"Unidades",C1:"Precio de compra",D1:"Coste"};PRODUCTOS.forEach(function(p,i){c["A"+(i+2)]=p[0];c["B"+(i+2)]=p[3];c["C"+(i+2)]=p[5];});return c;}
var TXT={F:true}; /* columnas de texto */

/* estilos: por hoja y celda → {mon, neg, fons, cen, vor} */
var S={
  p1:{sel:null,rec:null,done:{},msg:"",ok:false},
  p2:{a:"A1",b:"A1",tarea:0,menu:null,dialeg:false,cat:null,est:{},msg:"",ok:false},
  p3:{a:"A1",b:"A1",est:{},paleta:false,msg:"",ok:false},
  p4:{a:"A1",b:"A1",est:{},vores:false,msg:"",ok:false},
  p5:{full:"Productos",a:"A1",b:"A1",clon:null,ini:null,est:{Productos:{},Compras:{}},msg:"",ok:false,hecho:false}
};
var paso=0;
var MODO=((location.hash||"").toLowerCase()==="#ficha")?"ficha":"practica";

var MENUS=["Fitxer","Edita","Visualitza","Insereix","Format","Estils","Full","Dades","Eines","Finestra","Ajuda"];
function ponerEst(est,refs,clave,valor){refs.forEach(function(r){(est[r]=est[r]||{})[clave]=valor;});}
/* estilo base que arrastran los pasos: moneda (paso 2), encabezados (3), bordes (4) */
function estBase(hasta){
  var e={};
  if(hasta>=2){ponerEst(e,rango("D2","D11"),"mon",true);ponerEst(e,rango("G2","G11"),"mon",true);}
  if(hasta>=3){var cab=rango("A1","G1");ponerEst(e,cab,"neg",true);ponerEst(e,cab,"fons","#fbd5ae");ponerEst(e,cab,"cen",true);}
  if(hasta>=4)ponerEst(e,rango("A1","G11"),"vor",true);
  return e;
}
function mezclar(a,b){var r={};[a,b].forEach(function(x){Object.keys(x).forEach(function(k){r[k]=Object.assign({},r[k]||{},x[k]);});});return r;}
function calc(op){
  var cel=op.cel, est=op.est||{}, a=op.a||"A1", b=op.b||a, sel=rango(a,b), filas=op.filas||11;
  var anchos=op.anchos||[34,150,95,120,90,120,120];
  var h='<div class="calc'+(op.clon?" clonando":"")+'"'+(op.dialeg?' style="min-height:560px"':'')+'>';
  h+='<div class="c-tit"><span>Kiosco_FPB.ods — LibreOffice Calc</span><span>— ▢ ✕</span></div>';
  h+='<div class="c-menu">'+MENUS.map(function(m){return '<span'+(op.menus&&op.menus.indexOf(m)>=0?' data-menu="'+m+'"':"")+(op.menu===m?' class="abierto"':"")+'>'+m+'</span>';}).join("")+'</div>';
  if(op.desp)h+=op.desp;

/* ===== PDF de resultado ===== */
function cp1252(s){
  var map={"—":"\x97","–":"\x96","“":"\x93","”":"\x94","‘":"\x91","’":"\x92","•":"\x95","…":"\x85","€":"\x80","→":"->","›":">","✔":"[x]","✖":"[ ]","−":"-"};
  s=String(s).normalize("NFC");var out="";
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i),c=ch.charCodeAt(0);
    if(map.hasOwnProperty(ch))out+=map[ch];
    else if(c>=0xD800&&c<=0xDFFF){}
    else if(c<32)out+=" ";
    else if(c<127||(c>=160&&c<256))out+=ch;
    else out+="?";
  }
  return out;
}
function pdfEsc(s){return s.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");}
function envolver(texto,size,sangria){
  var max=Math.floor(495/(0.53*size))-(sangria||0),pal=cp1252(texto).split(" "),l=[],act="";
  pal.forEach(function(w){
    while(w.length>max){if(act){l.push(act);act="";}l.push(w.slice(0,max));w=w.slice(max);}
    if((act+" "+w).trim().length>max){l.push(act);act=w;}else act=(act?act+" ":"")+w;
  });
  l.push(act);return l;
}
function construyePDF(lineas){
  var pags=[[]],y=792,M=50;
  lineas.forEach(function(L){
    var size=L.s||11,lh=size*1.4,sang=L.i||0;
    var partes=L.t===""?[""]:envolver(L.t,size,sang);
    partes.forEach(function(txt,idx){
      if(y-lh<M){pags.push([]);y=792;}
      y-=lh;
      pags[pags.length-1].push("BT /"+(L.b?"F2":"F1")+" "+size+" Tf "+(M+sang*size*0.53+(idx&&L.h?size*1.2:0)).toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(txt)+") Tj ET");
    });
  });
  var n=pags.length,total=4+n*2;
  var lista=[null,"<< /Type /Catalog /Pages 2 0 R >>",null,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
  var kids=[];
  pags.forEach(function(p,i){
    var idc=5+i*2,idp=6+i*2,cont=p.join("\n");
    lista[idc]="<< /Length "+cont.length+" >>\nstream\n"+cont+"\nendstream";
    lista[idp]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+idc+" 0 R >>";
    kids.push(idp+" 0 R");
  });
  lista[2]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>";
  var pdf="%PDF-1.4\n",offs=[];
  for(var k=1;k<=total;k++){offs[k]=pdf.length;pdf+=k+" 0 obj\n"+lista[k]+"\nendobj\n";}
  var xref=pdf.length;
  pdf+="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(var q=1;q<=total;q++)pdf+=("0000000000"+offs[q]).slice(-10)+" 00000 n \n";
  pdf+="trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  var bytes=new Uint8Array(pdf.length);
  for(var b=0;b<pdf.length;b++)bytes[b]=pdf.charCodeAt(b)&255;
  return bytes;
}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ("00000000"+(h>>>0).toString(16)).slice(-8).toUpperCase();}
