<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Periféricos de entrada</title><desc id="desc">Ilustración didáctica de LibreOffice Calc</desc>
<rect width="1200" height="675" fill="#FBF8F4"/><text x="600" y="72" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" fill="#234F77" font-weight="700" text-anchor="middle">INTRODUCIR DATOS EN CALC</text><rect x="80" y="150" width="230" height="270" rx="16" fill="#FBE2CC" stroke="#234F77" stroke-width="3"/><text x="195" y="200" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#234F77" font-weight="700" text-anchor="middle">TECLADO NUMÉRICO</text><text x="195" y="258" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Precios</text><text x="195" y="294" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Unidades</text><text x="195" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Bloq Num</text><rect x="350" y="150" width="230" height="270" rx="16" fill="#EEF4F8" stroke="#234F77" stroke-width="3"/><text x="465" y="200" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#234F77" font-weight="700" text-anchor="middle">LECTOR DE CÓDIGOS</text><text x="465" y="258" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Código del producto</text><text x="465" y="294" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">13 cifras</text><text x="465" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Formato Text</text><rect x="620" y="150" width="230" height="270" rx="16" fill="#E7F5EC" stroke="#234F77" stroke-width="3"/><text x="735" y="200" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#234F77" font-weight="700" text-anchor="middle">ESCÁNER O MÓVIL</text><text x="735" y="258" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Logotipo</text><text x="735" y="294" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Fotografías</text><text x="735" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Insereix > Imatge</text><rect x="890" y="150" width="230" height="270" rx="16" fill="#FFF4D5" stroke="#234F77" stroke-width="3"/><text x="1005" y="200" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#234F77" font-weight="700" text-anchor="middle">OTRAS APLICACIONES</text><text x="1005" y="258" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Archivos CSV</text><text x="1005" y="294" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Pegar sin formato</text><text x="1005" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#263238" text-anchor="middle">Ctrl + Alt + Mayús + V</text><text x="600" y="500" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" fill="#F28C28" font-weight="700" text-anchor="middle">No todo se escribe a mano</text><text x="600" y="550" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#263238" text-anchor="middle">Elegimos el periférico según el tipo de dato que queremos introducir.</text>
</svg>
