<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Referencias relativas y absolutas</title><desc id="desc">Ilustración didáctica de LibreOffice Calc</desc>
<rect width="1200" height="675" fill="#FBF8F4"/><text x="600" y="60" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" fill="#234F77" font-weight="700" text-anchor="middle">REFERENCIAS RELATIVAS Y ABSOLUTAS</text><rect x="80" y="140" width="500" height="390" rx="16" fill="#FFFFFF" stroke="#234F77" stroke-width="3"/><text x="330" y="195" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#234F77" font-weight="700" text-anchor="middle">RELATIVA</text><text x="330" y="255" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" fill="#263238" font-weight="700" text-anchor="middle">=F2-G2</text><defs><marker id="a330290" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><line x1="330" y1="290" x2="330" y2="350" stroke="#F28C28" stroke-width="6" marker-end="url(#a330290)"/><text x="330" y="405" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" fill="#F28C28" font-weight="700" text-anchor="middle">=F3-G3</text><text x="330" y="470" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#263238" font-weight="500" text-anchor="middle">Cambia al copiar</text><rect x="620" y="140" width="500" height="390" rx="16" fill="#FFFFFF" stroke="#F28C28" stroke-width="3"/><text x="870" y="195" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#F28C28" font-weight="700" text-anchor="middle">ABSOLUTA</text><text x="870" y="255" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" fill="#263238" font-weight="700" text-anchor="middle">=D2*(1+$B$1)</text><defs><marker id="a870290" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><line x1="870" y1="290" x2="870" y2="350" stroke="#F28C28" stroke-width="6" marker-end="url(#a870290)"/><text x="870" y="405" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" fill="#F28C28" font-weight="700" text-anchor="middle">=D3*(1+$B$1)</text><text x="870" y="470" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#263238" font-weight="500" text-anchor="middle">$B$1 permanece fija</text>
