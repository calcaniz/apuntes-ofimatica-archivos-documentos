<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calc virtual · S04.06</title>
<style>
:root{

  --ok:#2e7d32; --okbg:#e8f5e9; --ko:#c62828; --kobg:#fdecea; --texto:#2b2118; --gris:#6b6258;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:#fff;font-size:19px;line-height:1.45;overflow-x:hidden}
.app{max-width:980px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--secundario);color:#fff;padding:12px 16px}
header h1{font-size:19px;margin:0 0 8px;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;font-size:16px}
.barra-prog{flex:1;height:12px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--principal);border-radius:99px;transition:width .3s}
.estrellas{font-weight:700;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 12px;white-space:nowrap}

.card{flex:1;padding:18px 16px}

.ayuda{font-size:19px;margin:0 0 16px;background:var(--claro);border-left:6px solid var(--principal);padding:10px 14px;border-radius:6px}
.btn{font:inherit;font-size:20px;min-height:54px;padding:10px 22px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;color:var(--texto)}
.btn:hover{background:#f8f1e8}
.btn.pri{background:var(--principal);border-color:var(--secundario);color:#2b1a05;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.grande{font-size:22px;padding:14px 28px}
.nav{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:2px solid var(--borde);background:#faf7f3;position:sticky;bottom:0}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:19px}
.msg.ok{background:var(--okbg);color:#1b5e20;border:2px solid var(--ok)}
.msg.ko{background:var(--kobg);color:#8e1b1b;border:2px solid var(--ko)}
.msg.info{background:var(--claro);border:2px solid var(--borde)}
.msg code,.ayuda code,.tarea code,.rec code{font-size:.92em;background:#f3ece2;padding:0 4px;border-radius:4px}
.op{font:inherit;font-size:19px;min-height:52px;padding:8px 16px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;text-align:left;color:var(--texto)}
.op:hover{background:#f8f1e8}
.op.bien{border-color:var(--ok);background:var(--okbg);font-weight:700}
.op.mal{border-color:var(--ko);background:var(--kobg)}
.op.quitada{opacity:.35;text-decoration:line-through;cursor:not-allowed}

.pregunta{border:2px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:12px}
.pregunta.ok{border-color:var(--ok)}
.pregunta>b{display:block;margin-bottom:8px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font:inherit;font-size:20px;font-family:Consolas,Menlo,monospace;font-weight:700;border:2px solid #b9ad9f;background:#fff;border-radius:99px;padding:8px 18px;cursor:pointer;color:var(--texto)}

.c-nom{width:90px;border:1px solid #bbb;background:#fff;padding:2px 6px;font-family:Consolas,Menlo,monospace}

.c-area th.esq{width:30px}
.c-area td{border:1px solid #c9c9c9;height:23px;padding:0 4px;white-space:nowrap;overflow:hidden;font-size:14px;cursor:cell;position:relative}
.c-area td.num{text-align:right}
.c-area td.cab{font-weight:700;text-align:center;background:#fbd5ae}
.c-area td.etq{font-weight:700;text-align:right;background:#fdf4e9}
.c-area td.err{color:#c62828;font-weight:700;text-align:right}
.c-area td.rec{color:#c62828;font-weight:700}
.c-area td.suf{color:#2e7d32;font-weight:700}

.c-area td.ref2{box-shadow:inset 0 0 0 2px #c62828}
.c-area td.ref3{box-shadow:inset 0 0 0 2px #6a1b9a}
.c-area td input{position:absolute;inset:0;width:100%;height:100%;border:2px solid #1e6fd9;font:inherit;font-size:14px;padding:0 3px;min-height:0;border-radius:0;background:#fff}
.asa{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;background:#1e6fd9;border:1px solid #fff;cursor:crosshair;z-index:2}
.c-tabs{display:flex;align-items:flex-end;gap:2px;background:#ececec;border-top:1px solid #ccc;padding:4px 6px 0}

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ===== almacenamiento compartido entre la práctica y la ficha ===== */
var KEY="s0406-ofimatica-v1", mem=null, stoOk=true;
function cargar(){
  var o=null;
  try{var s=localStorage.getItem(KEY);if(s)o=JSON.parse(s);}catch(e){stoOk=false;}
  if(!o)o=mem||{};
  o.alumno=o.alumno||""; o.practica=o.practica||{}; o.ficha=o.ficha||{}; o.err=o.err||{}; o.est=o.est||{}; o.fails=o.fails||{};
  return o;
}
function guardar(o){mem=o;try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){stoOk=false;$("avisoSto").hidden=false;}}
function upd(fn){var o=cargar();fn(o);guardar(o);}
function ahora(){var d=new Date(),z=function(n){return (n<10?"0":"")+n;};return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes());}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]/g,"");}
function nombrePDF(a){var p=a.trim().split(/\s+/).filter(Boolean);return p.length<2?null:"S04.06_Resultado_"+norm(p[0])+"_"+norm(p.slice(1).join(""))+".pdf";}
function error(k){upd(function(o){o.err[k]=(o.err[k]||0)+1;});}

/* ===== feedback positivo ===== */
var ELOGIOS=["¡Muy bien!","¡Genial!","¡Eso es!","¡Perfecto!","¡Buen trabajo!","¡Lo has clavado!","¡Excelente!"];
var ANIMOS=["¡Casi! Inténtalo otra vez.","¡Sin problema! Prueba de nuevo.","¡Ánimo, tú puedes!","Piénsalo un momento y vuelve a probar."];
function elogio(seed){return ELOGIOS[Math.abs(seed|0)%ELOGIOS.length];}
function animo(n){return ANIMOS[Math.abs(n|0)%ANIMOS.length];}
function semilla(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return Math.abs(h);}
function intento(clave,ok){upd(function(o){if(ok){if(!o.fails[clave])o.est[clave]=1;}else o.fails[clave]=(o.fails[clave]||0)+1;});}
function numEst(){return Object.keys(cargar().est).length;}
function confeti(){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  var em=["🎉","⭐","✨","🎊","🌟"];
  for(var i=0;i<22;i++){
    var d=document.createElement("span");d.className="conf";d.textContent=em[i%em.length];
    d.style.left=(Math.random()*96)+"vw";d.style.animationDelay=(Math.random()*0.6)+"s";d.style.fontSize=(22+Math.random()*16)+"px";
    document.body.appendChild(d);(function(x){setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x);},3200);})(d);
  }
}

/* ===== hoja y fórmulas ===== */
var COLS=["A","B","C","D","E","F","G"];
function partir(r){var m=/^\$?([A-Z])\$?(\d+)$/.exec(r);return {c:COLS.indexOf(m[1]),f:+m[2]};}
function ref(c,f){return COLS[c]+f;}
function rango(a,b){var x=partir(a),y=partir(b),r=[];for(var f=Math.min(x.f,y.f);f<=Math.max(x.f,y.f);f++)for(var c=Math.min(x.c,y.c);c<=Math.max(x.c,y.c);c++)r.push(ref(c,f));return r;}
function txtRango(a,b){var r=rango(a,b);return r.length===1?r[0]:r[0]+":"+r[r.length-1];}
function esNum(v){return /^-?\d+(,\d+)?$/.test(String(v).trim());}
function valNum(v){return parseFloat(String(v).trim().replace(",","."));}
function redondea(n){return Math.round(n*1e9)/1e9;}
var FUNCIONES={"SUMA":"SUMA","MITJANA":"MITJANA","MÀX":"MÀX","MÍN":"MÍN","COMPTA":"COMPTA","SI":"SI"};
var PISTAS_FN={"PROMEDIO":"En nuestro Calc la media se calcula con <code>MITJANA</code>.","CONTAR":"En nuestro Calc se cuenta con <code>COMPTA</code>.","MAX":"En valenciano se escribe <code>MÀX</code>, con acento.","MIN":"En valenciano se escribe <code>MÍN</code>, con acento.","SUM":"En nuestro Calc la suma es <code>SUMA</code>.","AVERAGE":"En nuestro Calc la media es <code>MITJANA</code>.","IF":"En nuestro Calc la función es <code>SI</code>.","MEDIA":"En nuestro Calc la media se calcula con <code>MITJANA</code>."};
/* Evaluador propio (sin eval): números con coma, textos "…", referencias con o sin $, rangos, funciones en valenciano, comparaciones */
function evalua(form,cel,propia){
  var s=form.slice(1), i=0, ultimaFn=null;
  function err(e,extra){throw {calc:e,extra:extra};}
  function blancos(){while(s.charAt(i)===" ")i++;}
  function leeRef(){var m=/^\$?[A-Ga-g]\$?[1-9]\d*/.exec(s.slice(i));if(!m)return null;var resto=s.slice(i+m[0].length);if(/^[A-Za-zÀ-ÿ(]/.test(resto))return null;i+=m[0].length;return m[0].toUpperCase().replace(/\$/g,"");}
  function valorCelda(r){
    if(r===propia)err("Err:522");
    var v=cel[r];
    if(v===undefined||v==="")return 0;
    if(String(v).charAt(0)==="="){var x=evalua(v,cel,r);if(typeof x==="string"&&/^(#|Err)/.test(x))err(x);return x;}
    if(esNum(v))return valNum(v);
    return {txt:String(v)};
  }
  function num(v){if(typeof v==="number")return v;if(v&&v.txt!==undefined)err("#VALUE!");if(Array.isArray(v))err("#VALUE!");return v;}
  function primario(){
    blancos();
    var c=s.charAt(i);
    if(c==="("){i++;var v=comp();blancos();if(s.charAt(i)!==")")err("Err:501");i++;return v;}
    if(c==="-"){i++;return -num(primario());}
    if(c==='"'){var j=s.indexOf('"',i+1);if(j<0)err("Err:501");var t=s.slice(i+1,j);i=j+1;return {txt:t};}
    var m=/^\d+(,\d+)?/.exec(s.slice(i)); if(m){i+=m[0].length;return valNum(m[0]);}
    var p0=i, r1=leeRef();
    if(r1){blancos();if(s.charAt(i)===":"){i++;var r2=leeRef();if(!r2)err("Err:501");return rango(r1,r2).map(valorCelda);}return valorCelda(r1);}
    i=p0;
    m=/^[A-Za-zÀ-ÿ]+/.exec(s.slice(i));
    if(m){var nombre=m[0].toUpperCase();i+=m[0].length;blancos();
      if(s.charAt(i)!=="("||!FUNCIONES[nombre])err("#NAME?",PISTAS_FN[nombre]);
      i++;var args=[];blancos();
      if(s.charAt(i)!==")"){while(true){args.push(comp());blancos();if(s.charAt(i)===";"){i++;continue;}if(s.charAt(i)===",")err("Err:508","Los argumentos se separan con <b>punto y coma</b> (;).");break;}}
      blancos();if(s.charAt(i)!==")")err("Err:501","Falta cerrar el paréntesis.");i++;
      ultimaFn=nombre;return funcion(nombre,args);}
    err("Err:509");
  }
  function plano(args){var r=[];args.forEach(function(a){if(Array.isArray(a))r=r.concat(a);else r.push(a);});return r;}
  function funcion(n,args){
    if(n==="SI"){if(args.length<2)err("Err:511");var cond=args[0];return (cond&&cond!==0)?args[1]:(args.length>2?args[2]:false);}
    var vals=plano(args), nums=vals.filter(function(v){return typeof v==="number";});
    if(n==="COMPTA")return nums.length;
    if(n==="SUMA")return nums.reduce(function(a,b){return a+b;},0);
    if(!nums.length)err("#DIV/0!");
    if(n==="MITJANA")return nums.reduce(function(a,b){return a+b;},0)/nums.length;
    if(n==="MÀX")return Math.max.apply(null,nums);
    if(n==="MÍN")return Math.min.apply(null,nums);
  }
  function potencia(){var b=primario();blancos();while(s.charAt(i)==="^"){i++;b=Math.pow(num(b),num(primario()));blancos();}return b;}
  function producto(){var v=potencia();blancos();while(s.charAt(i)==="*"||s.charAt(i)==="/"){var o=s.charAt(i++),d=num(potencia());v=num(v);if(o==="/"){if(d===0)err("#DIV/0!");v=v/d;}else v=v*d;blancos();}return v;}
  function suma(){var v=producto();blancos();while(s.charAt(i)==="+"||s.charAt(i)==="-"){var o=s.charAt(i++),d=num(producto());v=num(v);v=o==="+"?v+d:v-d;blancos();}return v;}
  function comp(){var v=suma();blancos();var m=/^(<=|>=|<>|<|>|=)/.exec(s.slice(i));if(m){i+=m[0].length;var d=suma();var a=(v&&v.txt!==undefined)?v.txt:v,b=(d&&d.txt!==undefined)?d.txt:d;
      switch(m[0]){case"<":return a<b;case">":return a>b;case"<=":return a<=b;case">=":return a>=b;case"=":return a===b;case"<>":return a!==b;}}return v;}
  try{if(!s.trim())err("Err:509");var r=comp();blancos();if(i<s.length)err("Err:509");evalua.fn=ultimaFn;evalua.extra=null;
    if(Array.isArray(r))return "#VALUE!";if(r&&r.txt!==undefined)return {txt:r.txt};if(typeof r==="boolean")return r?1:0;return redondea(r);}
  catch(e){if(e&&e.calc){evalua.extra=e.extra||null;return e.calc;}throw e;}
}
function refsDe(form){return (String(form).toUpperCase().match(/\$?[A-G]\$?[1-9]\d*/g)||[]).map(function(x){return x.replace(/\$/g,"");});}
/* copia una fórmula desplazando solo lo que no lleva $ */
function desplaza(form,df,dc){
  return form.replace(/(\$?)([A-Ga-g])(\$?)([1-9]\d*)/g,function(m,dc1,c,df1,f,pos,str){
    var antes=str.charAt(pos-1); if(/[A-Za-zÀ-ÿ]/.test(antes))return m;
    var col=dc1?c.toUpperCase():COLS[COLS.indexOf(c.toUpperCase())+dc], fila=df1?f:(+f+df);
    return dc1+col+df1+fila;});
}
function numTxt(n){return String(redondea(n)).replace(".",",");}
function eur(n){return redondea(n).toFixed(2).replace(".",",")+" €";}
function pct(n){return (redondea(n)*100).toFixed(2).replace(".",",")+" %";}

var PRODUCTOS=[["Agua","1","20","24"],["Zumo de naranja","1,5","15","18"],["Refresco de cola","1,2","22","24"],["Batido de cacao","1","10","12"],
 ["Bocadillo de tortilla","2,5","14","15"],["Bocadillo de jamón","2,5","12","15"],["Sándwich vegetal","2","6","10"],["Manzana","0,5","18","25"],
 ["Galletas","0,8","16","20"],["Barrita de cereales","0,7","11","20"]];
function ventas(){
  var c={A1:"Producto",B1:"Precio de venta",C1:"Unidades vendidas",D1:"Ingresos",E1:"% del total",C12:"Total"};
  PRODUCTOS.forEach(function(p,i){var f=i+2;c["A"+f]=p[0];c["B"+f]=p[1];c["C"+f]=p[2];c["D"+f]="=B"+f+"*C"+f;});
  return c;
}
function existencias(){
  var c={A1:"Producto",B1:"Existencias",C1:"Vendidas",D1:"Quedan",E1:"Estado"};
  PRODUCTOS.forEach(function(p,i){var f=i+2;c["A"+f]=p[0];c["B"+f]=p[3];c["C"+f]=p[2];c["D"+f]="=B"+f+"-C"+f;});
  return c;
}
/* formato de presentación por columna en cada hoja */
var FMT_VENTAS={B:"eur",D:"eur",E:"pct"}, FMT_EXIS={};

/* ===== estado ===== */
var S={
  p1:{sel:null,rec:null,done:{},msg:"",ok:false},
  p2:{cel:ventas(),a:"D12",ed:null,edVal:"",hecho:false,msg:"",ok:false},
  p3:{cel:null,a:"E2",b:"E2",ed:null,edVal:"",tarea:0,arr:false,msg:"",ok:false},
  p4:{cel:null,a:"D14",ed:null,edVal:"",hechas:{},msg:"",ok:false},
  p5:{cel:existencias(),a:"E2",b:"E2",ed:null,edVal:"",tarea:0,arr:false,msg:"",ok:false}
};
var paso=0;

function explicaError(v){
  var extra=evalua.extra;
  if(v==="#NAME?")return "<b>#NAME?</b>: Calc no reconoce el nombre de la función."+(extra?" "+extra:" Revisa cómo se escribe.");
  if(v==="Err:522")return "<b>Err:522</b>: la fórmula usa su propia celda.";
  if(v==="Err:508"||v==="Err:501")return "<b>"+v+"</b>: "+(extra||"revisa los paréntesis.");
  if(v==="#VALUE!")return "<b>#VALUE!</b>: la fórmula mezcla texto con números.";
  if(v==="#DIV/0!")return "<b>#DIV/0!</b>: la fórmula divide entre cero o entre una celda vacía.";
  return "La fórmula da <b>"+v+"</b>. Revísala en la barra de fórmules.";
}
function revisa(raw,cel,celda,obj,necesita){
  raw=String(raw||"").trim();
  if(!raw)return {ok:false,m:"Escribe la fórmula en <b>"+celda+"</b>."};
  if(raw.charAt(0)!=="=")return {ok:false,m:"Falta el signo <b>=</b> al principio: sin él, Calc lo toma como texto."};
  var v=evalua(raw,cel,celda);
  if(typeof v==="string")return {ok:false,m:explicaError(v)};
  if(v&&v.txt!==undefined)return {ok:false,m:"La fórmula devuelve un texto («"+esc(v.txt)+"»)."};
  if(Math.abs(v-obj)>1e-6)return {ok:false,v:v,m:null};
  if(necesita&&!necesita.test(raw.toUpperCase()))return {ok:false,m:"El resultado es correcto, pero en esta tarea hay que usar la función que se pide."};
  return {ok:true,v:v};
}
function confirmar(st,dir){
  if(!st.ed)return null;
  var celda=st.ed, v=(st.edVal||"").trim();
  if(v==="")delete st.cel[celda]; else st.cel[celda]=v;
  st.ed=null;
  var x=partir(celda);
  if(dir==="abajo")st.a=ref(x.c,Math.min(x.f+1,16)); else if(dir==="derecha")st.a=ref(Math.min(x.c+1,6),x.f);
  if(st.b!==undefined)st.b=st.a;
  return celda;
}

  if(paso===3){var q=S.p4, obj={D14:[18.54,"MITJANA","la media"],D15:[35,"MÀX","el mayor"],D16:[7.7,"MÍN","el menor"]}[celda];

  if(paso===4){var w=S.p5;

function rellenar(st,destino,col,clave){
  var sel=rango(st.a,st.b); st.arr=false;
  if(sel.length!==1||sel[0]!==col+"2"){st.msg="Selecciona solo <b>"+col+"2</b> antes de arrastrar.";st.ok=false;error("copiar");intento(clave,false);return false;}
  var d=partir(destino);
  if(COLS[d.c]!==col){st.msg="Arrastra hacia abajo por la columna <b>"+col+"</b>.";st.ok=false;error("copiar");intento(clave,false);return false;}
  if(d.f<11){st.msg="Has llegado hasta <b>"+destino+"</b>: arrastra hasta <b>"+col+"11</b>.";st.ok=false;error("copiar");intento(clave,false);return false;}
  if(d.f>11){st.msg="Te has pasado: los productos terminan en la fila 11.";st.ok=false;error("copiar");intento(clave,false);return false;}
  for(var f=3;f<=11;f++)st.cel[col+f]=desplaza(st.cel[col+"2"],f-2,0);

}

/* Mayús + F4 dentro de la celda: cambia el tipo de la referencia que hay justo antes del cursor */
function cicloRef(inp){
  var pos=inp.selectionStart, txt=inp.value, antes=txt.slice(0,pos), m=/(\$?)([A-Ga-g])(\$?)(\d+)$/.exec(antes);
  if(!m)return;

  var np=antes.length-m[0].length+nuevo.length; inp.setSelectionRange(np,np);

/* ===== PDF de resultado ===== */
function cp1252(s){
  var map={"—":"\x97","–":"\x96","“":"\x93","”":"\x94","‘":"\x91","’":"\x92","•":"\x95","…":"\x85","€":"\x80","→":"->","›":">","✔":"[x]","✖":"[ ]","−":"-","×":"x","÷":"/"};
  s=String(s).normalize("NFC");var out="";
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i),c=ch.charCodeAt(0);
    if(map.hasOwnProperty(ch))out+=map[ch];
    else if(c>=0xD800&&c<=0xDFFF){}
    else if(c<32)out+=" ";
    else if(c<127||(c>=160&&c<256))out+=ch;
    else out+="?";
  }
  return out;
}
function pdfEsc(s){return s.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");}
function envolver(texto,size,sangria){
  var max=Math.floor(495/(0.53*size))-(sangria||0),pal=cp1252(texto).split(" "),l=[],act="";
  pal.forEach(function(w){
    while(w.length>max){if(act){l.push(act);act="";}l.push(w.slice(0,max));w=w.slice(max);}
    if((act+" "+w).trim().length>max){l.push(act);act=w;}else act=(act?act+" ":"")+w;
  });
  l.push(act);return l;
}
function construyePDF(lineas){
  var pags=[[]],y=792,M=50;
  lineas.forEach(function(L){
    var size=L.s||11,lh=size*1.4,sang=L.i||0;
    var partes=L.t===""?[""]:envolver(L.t,size,sang);
    partes.forEach(function(txt,idx){
      if(y-lh<M){pags.push([]);y=792;}
      y-=lh;
      pags[pags.length-1].push("BT /"+(L.b?"F2":"F1")+" "+size+" Tf "+(M+sang*size*0.53+(idx&&L.h?size*1.2:0)).toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(txt)+") Tj ET");
    });
  });
  var n=pags.length,total=4+n*2;
  var lista=[null,"<< /Type /Catalog /Pages 2 0 R >>",null,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
  var kids=[];
  pags.forEach(function(p,i){
    var idc=5+i*2,idp=6+i*2,cont=p.join("\n");
    lista[idc]="<< /Length "+cont.length+" >>\nstream\n"+cont+"\nendstream";
    lista[idp]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+idc+" 0 R >>";
    kids.push(idp+" 0 R");
  });
  lista[2]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>";
  var pdf="%PDF-1.4\n",offs=[];
  for(var k=1;k<=total;k++){offs[k]=pdf.length;pdf+=k+" 0 obj\n"+lista[k]+"\nendobj\n";}
  var xref=pdf.length;
  pdf+="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(var q=1;q<=total;q++)pdf+=("0000000000"+offs[q]).slice(-10)+" 00000 n \n";
  pdf+="trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  var bytes=new Uint8Array(pdf.length);
  for(var b=0;b<pdf.length;b++)bytes[b]=pdf.charCodeAt(b)&255;
  return bytes;
}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ("00000000"+(h>>>0).toString(16)).slice(-8).toUpperCase();}

  t("");
  t("Código de comprobación: "+hash(canon.join("|")),9,true);
  return L;
}
