<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Tipos de datos</title><desc id="desc">Ilustración didáctica de LibreOffice Calc</desc>
<rect width="1200" height="675" fill="#FBF8F4"/><text x="600" y="62" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" fill="#234F77" font-weight="700" text-anchor="middle">TIPOS DE DATOS EN CALC</text><rect x="80" y="170" width="190" height="230" rx="16" fill="#FBE2CC" stroke="#234F77" stroke-width="3"/><text x="175" y="225" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#234F77" font-weight="700" text-anchor="middle">TEXTO</text><text x="175" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#263238" font-weight="600" text-anchor="middle">Agua</text><rect x="300" y="170" width="190" height="230" rx="16" fill="#EEF4F8" stroke="#234F77" stroke-width="3"/><text x="395" y="225" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#234F77" font-weight="700" text-anchor="middle">NÚMERO</text><text x="395" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#263238" font-weight="600" text-anchor="middle">24</text><rect x="520" y="170" width="190" height="230" rx="16" fill="#E7F5EC" stroke="#234F77" stroke-width="3"/><text x="615" y="225" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#234F77" font-weight="700" text-anchor="middle">MONEDA</text><text x="615" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#263238" font-weight="600" text-anchor="middle">1,50 €</text><rect x="740" y="170" width="190" height="230" rx="16" fill="#FFF4D5" stroke="#234F77" stroke-width="3"/><text x="835" y="225" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#234F77" font-weight="700" text-anchor="middle">FECHA</text><text x="835" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#263238" font-weight="600" text-anchor="middle">20/11/2026</text><rect x="960" y="170" width="190" height="230" rx="16" fill="#F5E8F7" stroke="#234F77" stroke-width="3"/><text x="1055" y="225" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#234F77" font-weight="700" text-anchor="middle">FÓRMULA</text><text x="1055" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#263238" font-weight="600" text-anchor="middle">=E2*G2</text><text x="600" y="480" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" fill="#F28C28" font-weight="700" text-anchor="middle">El contenido y el formato no son lo mismo</text><text x="600" y="530" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#263238" font-weight="400" text-anchor="middle">Calc alinea normalmente el texto a la izquierda y los números a la derecha.</text>
</svg>
