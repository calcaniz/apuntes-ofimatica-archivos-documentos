<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Anatomía de una fórmula</title><desc id="desc">Ilustración didáctica de LibreOffice Calc</desc>
<rect width="1200" height="675" fill="#FBF8F4"/><text x="600" y="65" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" fill="#234F77" font-weight="700" text-anchor="middle">ANATOMÍA DE UNA FÓRMULA</text><rect x="170" y="190" width="860" height="120" rx="16" fill="#FFFFFF" stroke="#234F77" stroke-width="3"/><text x="600" y="268" font-family="Arial,DejaVu Sans,sans-serif" font-size="58" fill="#263238" font-weight="700" text-anchor="middle">= E2 * G2</text><defs><marker id="a310390" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><line x1="310" y1="390" x2="310" y2="315" stroke="#F28C28" stroke-width="6" marker-end="url(#a310390)"/><defs><marker id="a500390" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><line x1="500" y1="390" x2="500" y2="315" stroke="#F28C28" stroke-width="6" marker-end="url(#a500390)"/><defs><marker id="a685390" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><line x1="685" y1="390" x2="685" y2="315" stroke="#F28C28" stroke-width="6" marker-end="url(#a685390)"/><defs><marker id="a875390" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><line x1="875" y1="390" x2="875" y2="315" stroke="#F28C28" stroke-width="6" marker-end="url(#a875390)"/><text x="310" y="430" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#F28C28" font-weight="700" text-anchor="middle">Inicio</text><text x="500" y="430" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#234F77" font-weight="700" text-anchor="middle">Precio</text><text x="685" y="430" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#234F77" font-weight="700" text-anchor="middle">Multiplicar</text><text x="875" y="430" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#234F77" font-weight="700" text-anchor="middle">Unidades</text><text x="600" y="535" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#3C8D68" font-weight="700" text-anchor="middle">Cuando cambia E2 o G2, Calc actualiza el resultado.</text>
