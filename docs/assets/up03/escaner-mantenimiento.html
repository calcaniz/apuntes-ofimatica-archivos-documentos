<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller del escáner</title>
<style>
:root{
  --principal:#ff9944; --secundario:#81501c; --claro:#fdf4e9; --borde:#d9c9b6;
  --ok:#2e7d32; --okbg:#e8f5e9; --ko:#c62828; --kobg:#fdecea; --texto:#2b2118; --gris:#6b6258;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:#fff;font-size:19px;line-height:1.45;overflow-x:hidden}
.app{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--secundario);color:#fff;padding:12px 16px}
header h1{font-size:19px;margin:0 0 8px;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;font-size:16px}
.barra-prog{flex:1;height:12px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--principal);border-radius:99px;transition:width .3s}
.estrellas{font-weight:700;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 12px;white-space:nowrap}
.aviso-sto{background:#fff3cd;border-bottom:1px solid #e0b100;color:#5a4300;padding:6px 14px;font-size:15px}
.card{flex:1;padding:18px 16px}
.card h2{font-size:26px;margin:0 0 6px;color:var(--secundario)}
.ayuda{font-size:19px;margin:0 0 16px;background:var(--claro);border-left:6px solid var(--principal);padding:10px 14px;border-radius:6px}
.btn{font:inherit;font-size:20px;min-height:54px;padding:10px 22px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;color:var(--texto)}
.btn:hover{background:#f8f1e8}
.btn.pri{background:var(--principal);border-color:var(--secundario);color:#2b1a05;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.grande{font-size:22px;padding:14px 28px}
.op{font:inherit;font-size:19px;min-height:52px;padding:8px 16px;border-radius:12px;border:2px solid #b9ad9f;background:#fff;cursor:pointer;text-align:left;color:var(--texto)}
.op:hover{background:#f8f1e8}
.op.sel{border-color:var(--secundario);background:var(--claro);font-weight:700}
.op.bien{border-color:var(--ok);background:var(--okbg);font-weight:700}
.op.mal{border-color:var(--ko);background:var(--kobg)}
.op.quitada{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.opciones{display:flex;flex-wrap:wrap;gap:10px}
.nav{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:2px solid var(--borde);background:#faf7f3;position:sticky;bottom:0}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#sig.listo:not(:disabled){animation:pulso 1.2s ease-in-out infinite}
.conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:50;animation:cae 2.4s ease-in forwards}
@keyframes cae{to{transform:translateY(115vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){#sig.listo:not(:disabled){animation:none}.conf{display:none}}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:19px}
.msg.ok{background:var(--okbg);color:#1b5e20;border:2px solid var(--ok)}
.msg.ko{background:var(--kobg);color:#8e1b1b;border:2px solid var(--ko)}
.msg.info{background:var(--claro);border:2px solid var(--borde)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:700px){.dos{grid-template-columns:1fr}}
.maq{background:#f4f1ec;border:2px solid var(--borde);border-radius:14px;padding:8px}
.maq svg{width:100%;height:auto;display:block}
.parte{cursor:pointer}
.parte:hover{filter:brightness(1.08)}
.parte.vis rect,.parte.vis polygon,.parte.vis line,.parte.vis path{stroke:#2e7d32;stroke-width:5}
.parte.sel rect,.parte.sel polygon,.parte.sel line,.parte.sel path{stroke:#ff8a00;stroke-width:6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font:inherit;font-size:16px;border:2px solid #b9ad9f;background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--texto)}
.chip.vis{border-color:var(--ok);background:var(--okbg)}
.chip.sel{border-color:var(--secundario);font-weight:700}
.cont{font-size:18px;margin:8px 0}
.pasos-l{list-style:none;margin:0 0 12px;padding:0}
.pasos-l li{padding:6px 10px;border-radius:8px;margin-bottom:4px;font-size:18px;color:var(--gris)}
.pasos-l li.act{background:var(--claro);color:var(--texto);font-weight:700;border:2px solid var(--principal)}
.pasos-l li.hecho{color:var(--ok)}
.info-parte{background:var(--claro);border:2px solid var(--borde);border-radius:12px;padding:12px 14px;margin-top:10px}
.acc{border:2px solid var(--borde);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.acc.ok{border-color:var(--ok);background:var(--okbg)}
.acc .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.acc .ft b{font-size:19px}
.hs{width:120px;height:160px;background:#fff;border:2px solid #999;position:relative;overflow:hidden;display:inline-block;margin:4px;vertical-align:top}
.hs.grande{width:150px;height:200px}
.hs .in{position:absolute;left:12px;right:12px;top:14px}
.hs .tt{display:block;height:12px;background:#222;width:60%;margin:0 auto 10px}
.hs .ln{display:block;height:6px;background:#333;margin-bottom:8px}
.hs .ln.s{width:70%}
.hs.torcida .in{transform:rotate(-9deg);transform-origin:center}
.hs.borrosa .in{filter:blur(2.4px)}
.hs.cortada .in{left:-46px;right:-34px}
.tam{margin:8px 0 2px;font-size:18px}
.tam-bar{height:14px;background:#e6dfd5;border-radius:99px;overflow:hidden}
.tam-bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.pregunta{border:2px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:12px}
.pregunta.ok{border-color:var(--ok)}
.pregunta>b{display:block;margin-bottom:8px;font-size:20px}
.pregunta .opciones{flex-direction:column}
.pregunta .op{width:100%}
.pregunta .fila-img{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pregunta .fila-img .opciones{flex:1;min-width:220px}
.nombre-pdf{font-family:Consolas,Menlo,monospace;font-size:20px;background:#f4f4f4;border:2px solid #bbb;border-radius:10px;padding:10px 14px;word-break:break-all;margin:10px 0}
input[type=text]{font:inherit;font-size:20px;min-height:52px;padding:8px 12px;border:2px solid #b9ad9f;border-radius:10px;width:100%}
.grande-ok{font-size:64px;text-align:center;margin:0}
.aprendido{background:var(--claro);border:2px solid var(--borde);border-radius:12px;padding:10px 16px;margin:12px 0}
.aprendido ul{margin:6px 0 0;padding-left:22px}
.maq.tiembla{animation:tiembla .35s}
@keyframes tiembla{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.parpadea{animation:parpadeo 1s steps(2,start) infinite}
@keyframes parpadeo{to{opacity:.35}}
.hoja-sal.sale{animation:sale 1.1s ease-out}
@keyframes sale{from{transform:translateY(-24px);opacity:0}to{transform:translateY(0);opacity:1}}
.entra{animation:entra .5s ease-out}
@keyframes entra{from{transform:translateX(-60px);opacity:.2}to{transform:translateX(0);opacity:1}}
.agitaDiv{animation:agitaD .25s ease-in-out 6}
@keyframes agitaD{0%,100%{transform:translateX(0)}25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.cart-fuera{margin-top:8px;text-align:center;font-size:17px;background:#f1efec;border:2px dashed #8a8278;border-radius:10px;padding:6px}
.tecla{font:inherit;font-size:24px;font-weight:700;min-width:64px;min-height:58px;border-radius:14px;border:3px solid #222;background:#4a4a4a;color:#fff;cursor:pointer;padding:0 12px}
.tecla.inicio{background:#2e9e4f;border-color:#145a2b}
.tecla:active{transform:scale(.95)}
.copias-p{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.copias-p .n{min-width:52px;text-align:center;font-size:30px;font-weight:800;font-family:Consolas,monospace;background:#bfe6c8;border:3px solid #3b3b3b;border-radius:8px;padding:4px 8px}
.lcd-mini{font-family:Consolas,monospace;background:#ffd88a;border:4px solid #3b3b3b;border-radius:8px;padding:8px 12px;min-width:180px;display:flex;flex-direction:column;align-items:center;font-size:17px;font-weight:700}
.lcd-mini.verde{background:#bfe6c8}
.lcd-mini span:last-child{font-size:15px;font-weight:400}
.hojaG{display:inline-block;width:170px;height:220px;background:#fff;border:2px solid #999;padding:14px 12px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative}
.hojaG .hg-t{font-weight:800;font-size:13px;margin-bottom:10px;text-align:center}
.hojaG .hg-l{display:block;height:6px;background:#222;margin-bottom:9px}
.hojaG .hg-l.c{width:65%}
.orden-ok{margin:0 0 10px;padding-left:26px;font-size:18px;color:var(--ok);font-weight:700}
.orden-ok li{margin:4px 0}
.mancha{cursor:pointer}
.scan{display:inline-block;width:150px;height:200px;background:#fff;border:2px solid #999;padding:16px 14px;margin:6px;position:relative;overflow:hidden;vertical-align:top;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.scan .sc-t{height:10px;background:#222;width:60%;margin:0 auto 12px}
.scan .sc-l{display:block;height:6px;background:#333;margin-bottom:10px}
.scan .sc-l.c{width:70%}
.scan.linea:after{content:"";position:absolute;top:0;bottom:0;left:58%;width:3px;background:#111}
.scan.manchas:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(90,80,70,.45) 0 14px,transparent 15px),radial-gradient(circle at 70% 55%,rgba(90,80,70,.4) 0 18px,transparent 19px),radial-gradient(circle at 40% 80%,rgba(90,80,70,.35) 0 12px,transparent 13px)}
.scan.manchas .sc-l,.scan.manchas .sc-t{filter:blur(1px)}
.scan.torcida .sc-t,.scan.torcida .sc-l{transform:rotate(-8deg)}
.scan.aparece{animation:sale 1.1s ease-out}
.scan-etq{font-size:15px;color:var(--gris);margin:0 6px 10px;max-width:170px;display:inline-block}
.pc-msg{margin-top:8px;font-size:17px;border-radius:10px;padding:8px 12px;border:2px solid #9aa5b1;background:#eef3f8}
.pc-msg.ko{border-color:var(--ko);background:var(--kobg);font-weight:700}
.pc-msg.ok{border-color:var(--ok);background:var(--okbg)}
.hojas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media (max-width:600px){.hojas{grid-template-columns:repeat(2,1fr)}}
.hoja-c{font:inherit;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid #b9ad9f;border-radius:12px;background:#fff;padding:10px;cursor:pointer;color:var(--texto)}
.hoja-c .ico{font-size:34px}
.hoja-c.mal{border-color:var(--ko);background:var(--kobg)}
.hoja-c.bien{border-color:var(--ok);background:var(--okbg);cursor:default}
.hoja-grapa{font-size:56px;position:relative;width:80px;text-align:center}
.hoja-grapa span{position:absolute;left:4px;top:-4px;font-size:26px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="titulo">🛠️ Taller del escáner</h1>
    <div class="prog"><span id="pasoTxt"></span><div class="barra-prog"><i id="barra"></i></div><span class="estrellas" id="est" title="Estrellas por acertar a la primera">⭐ 0</span></div>
  </header>
  <div class="aviso-sto" id="avisoSto" hidden>Tu navegador no deja guardar datos entre pantallas. No cierres esta página hasta descargar el resultado.</div>
  <div class="card" id="card"></div>
  <div class="nav">
    <button class="btn" id="atras">← Atrás</button>
    <button class="btn pri" id="sig">Siguiente →</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ===== almacenamiento compartido entre la práctica y la ficha ===== */
var KEY="s0308-ofimatica-v1", mem=null, stoOk=true;
function cargar(){
  var o=null;
  try{var s=localStorage.getItem(KEY);if(s)o=JSON.parse(s);}catch(e){stoOk=false;}
  if(!o)o=mem||{};
  o.alumno=o.alumno||""; o.practica=o.practica||{}; o.ficha=o.ficha||{}; o.err=o.err||{}; o.est=o.est||{}; o.fails=o.fails||{};
  return o;
}
function guardar(o){mem=o;try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){stoOk=false;$("avisoSto").hidden=false;}}
function upd(fn){var o=cargar();fn(o);guardar(o);}

/* ===== registro de tiempo activo y fallos por paso ===== */
var ULTACT=Date.now(),BUF={},NBUF=0;
function regO(o){o.reg=o.reg||{};["practica","ficha"].forEach(function(m){var r=o.reg[m]=o.reg[m]||{};r.t=r.t||{};r.f=r.f||{};r.ok=r.ok||{};r.ini=r.ini||"";});return o.reg;}
function regFallo(){var pp=paso;upd(function(o){var r=regO(o)[MODO];r.f[pp]=(r.f[pp]||0)+1;});}
function regOk(){var pp=paso;upd(function(o){var r=regO(o)[MODO];if(!r.ok[pp])r.ok[pp]=ahora();});}
function actividad(){ULTACT=Date.now();}
function volcarTiempo(){if(!NBUF)return;var b=BUF;BUF={};NBUF=0;upd(function(o){var r=regO(o)[MODO];if(!r.ini)r.ini=ahora();for(var k in b)r.t[k]=(r.t[k]||0)+b[k];});}
function tic(){if(document.hidden||Date.now()-ULTACT>120000)return;BUF[paso]=(BUF[paso]||0)+1;NBUF++;if(NBUF>=5)volcarTiempo();}
function mmss(x){x=Math.round(x||0);var m=Math.floor(x/60),s=x%60;return m+" min "+(s<10?"0":"")+s+" s";}
function recorrido(t,lista,modo,o){
  var r=regO(o)[modo],tt=0,ft=0;
  lista.forEach(function(p,k){tt+=r.t[k]||0;ft+=r.f[k]||0;});
  t("Inicio: "+(r.ini||"-")+" · Tiempo activo: "+mmss(tt)+" · Fallos: "+ft,10);
  lista.forEach(function(p,k){if(p.ultimo&&modo==="ficha")return;t(String(p.t).replace(/<[^>]*>/g,""),11,true,2,true);t("Tiempo: "+mmss(r.t[k])+" · Fallos: "+(r.f[k]||0)+" · "+(r.ok[k]?"Completado a las "+r.ok[k].slice(-5):"Sin completar"),10,false,4,true);});
}
function arrancarRegistro(){
  ["mousedown","keydown","mousemove","wheel","touchstart"].forEach(function(t){document.addEventListener(t,actividad,{passive:true});});
  setInterval(tic,1000);window.addEventListener("pagehide",volcarTiempo);document.addEventListener("visibilitychange",volcarTiempo);
}
function ahora(){var d=new Date(),z=function(n){return (n<10?"0":"")+n;};return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes());}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]/g,"");}
function nombrePDF(a,tipo){var p=a.trim().split(/\s+/).filter(Boolean);return p.length<2?null:"S03.08_"+(tipo||"Resultado")+"_"+norm(p[0])+"_"+norm(p.slice(1).join(""))+".pdf";}
function error(k){upd(function(o){o.err[k]=(o.err[k]||0)+1;});regFallo();}

/* ===== feedback positivo ===== */
var ELOGIOS=["¡Muy bien!","¡Genial!","¡Eso es!","¡Perfecto!","¡Buen trabajo!","¡Lo has clavado!","¡Excelente!"];
var ANIMOS=["¡Casi! Inténtalo otra vez.","¡Sin problema! Prueba de nuevo.","¡Ánimo, tú puedes!","Piénsalo un momento y vuelve a probar."];
function elogio(seed){return ELOGIOS[Math.abs(seed|0)%ELOGIOS.length];}
function animo(n){return ANIMOS[Math.abs(n|0)%ANIMOS.length];}
function semilla(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return Math.abs(h);}
function intento(clave,ok){upd(function(o){if(ok){if(!o.fails[clave])o.est[clave]=1;}else o.fails[clave]=(o.fails[clave]||0)+1;});}
function numEst(){return Object.keys(cargar().est).length;}
function confeti(){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  var em=["🎉","⭐","✨","🎊","🌟"];
  for(var i=0;i<22;i++){
    var d=document.createElement("span");d.className="conf";d.textContent=em[i%em.length];
    d.style.left=(Math.random()*96)+"vw";d.style.animationDelay=(Math.random()*0.6)+"s";d.style.fontSize=(22+Math.random()*16)+"px";
    document.body.appendChild(d);(function(x){setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x);},3200);})(d);
  }
}

/* ===== utilidades comunes de los talleres de mantenimiento ===== */
var paso=0;
var MODO=((location.hash||"").toLowerCase()==="#ficha")?"ficha":"practica";
function opB(act,data,txt,sel){
  var at="";for(var k in data)at+=' data-'+k+'="'+esc(data[k])+'"';
  return '<button class="op'+(sel?" sel":"")+'" data-act="'+act+'"'+at+'>'+txt+'</button>';
}
function boton(act,txt,extra){return '<button class="btn" data-act="'+act+'"'+(extra||"")+'>'+txt+'</button>';}
function lista(items,act){
  return '<ul class="pasos-l">'+items.map(function(t,i){return '<li class="'+(i<act?"hecho":(i===act?"act":""))+'">'+(i<act?"✔ ":(i+1)+". ")+t+'</li>';}).join("")+'</ul>';
}
function msg(m,ok){return m?'<div class="msg '+(ok?"ok":"ko")+'">'+m+'</div>':"";}
function pregunta(sec,i,txt,ops,corr,sel,extra,exp){
  var hecho=sel!==undefined&&sel!==null&&sel!=="", bien=hecho&&+sel===corr;
  var fallos=cargar().fails[sec+i]||0, quitar=-1;
  if(!bien&&fallos>=2){for(var j=0;j<ops.length;j++){if(j!==corr&&!(hecho&&+sel===j)){quitar=j;break;}}}
  var o='<div class="opciones">'+ops.map(function(t,j){
    if(j===quitar)return '<button class="op quitada" disabled>'+esc(t)+'</button>';
    var cls=hecho&&+sel===j?(bien?" bien":" mal"):"";
    return '<button class="op'+cls+'" data-act="resp" data-sec="'+sec+'" data-i="'+i+'" data-v="'+j+'">'+(hecho&&+sel===j?(bien?"✔ ":"✖ "):"")+esc(t)+'</button>';
  }).join("")+'</div>';
  return '<div class="pregunta'+(bien?" ok":"")+'"><b>'+esc(txt)+'</b>'+(extra?'<div class="fila-img">'+extra+o+'</div>':o)+
    (hecho&&!bien?'<div class="msg ko">'+animo(fallos-1)+'</div>':"")+
    (quitar>=0?'<div class="msg info">💡 Pista: hemos quitado una opción.</div>':"")+
    (bien?'<div class="msg ok"><b>'+elogio(semilla(sec+i))+'</b> '+esc(exp||"")+'</div>':"")+'</div>';
}
/* preguntas de la ficha: [texto, opciones, correcta, explicación, extra(html)] */
function mk(sec,lst){return function(){var r=cargar().ficha[sec]||{};return lst.map(function(q,i){return pregunta(sec,i,q[0],q[1],q[2],r[i],q[4]?q[4]():null,q[3]);}).join("");};}
function okSec(sec,lst){return function(){var r=cargar().ficha[sec]||{};return lst.every(function(q,i){return r[i]!==undefined&&+r[i]===q[2];});};}
function lcdMini(t,color){var p=t.split("|");return '<div class="lcd-mini'+(color?" "+color:"")+'"><span>'+esc(p[0])+'</span><span>'+esc(p[1]||"")+'</span></div>';}
/* paso de la ficha para ordenar pasos */
function pasoOrden(sec,ORDEN,MEZCLA,fin){
  return {
    html:function(){
      var r=cargar().ficha[sec]||{orden:[]}, hechos=r.orden||[], sig=hechos.length;
      var h='<ol class="orden-ok">'+hechos.map(function(k){return '<li>✔ '+esc(ORDEN.filter(function(x){return x[0]===k;})[0][1])+'</li>';}).join("")+'</ol>';
      if(sig<ORDEN.length){
        h+='<p class="cont"><b>¿Cuál es el paso '+(sig+1)+'?</b></p><div class="opciones" style="flex-direction:column">'+MEZCLA.map(function(k){var x=ORDEN[k];if(hechos.indexOf(x[0])>=0)return "";
          return '<button class="op" data-act="orden" data-sec="'+sec+'" data-v="'+x[0]+'">'+esc(x[1])+'</button>';}).join("")+'</div>';
        if(S.ordenMsg)h+=msg(S.ordenMsg,false);
      }else h+=msg(fin,true);
      return h;
    },

function cp1252(s){
  var map={"—":"\x97","–":"\x96","“":"\x93","”":"\x94","‘":"\x91","’":"\x92","•":"\x95","…":"\x85","€":"\x80","→":"->","✔":"[x]","✖":"[ ]","−":"-"};
  s=String(s).normalize("NFC");var out="";
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i),c=ch.charCodeAt(0);
    if(map.hasOwnProperty(ch))out+=map[ch];
    else if(c>=0xD800&&c<=0xDFFF){}
    else if(c<32)out+=" ";
    else if(c<127||(c>=160&&c<256))out+=ch;
    else out+="?";
  }
  return out;
}
function pdfEsc(s){return s.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");}
function envolver(texto,size,sangria){

  pal.forEach(function(w){
    while(w.length>max){if(act){l.push(act);act="";}l.push(w.slice(0,max));w=w.slice(max);}
    if((act+" "+w).trim().length>max){l.push(act);act=w;}else act=(act?act+" ":"")+w;
  });
  l.push(act);return l;
}
function construyePDF(lineas){

      y-=lh;
      pags[pags.length-1].push("BT /"+(L.b?"F2":"F1")+" "+size+" Tf "+(M+sang*size*0.53+(idx&&L.h?size*1.2:0)).toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(txt)+") Tj ET");
    });
  });
  var n=pags.length,total=4+n*2;
  var lista=[null,"<< /Type /Catalog /Pages 2 0 R >>",null,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
  var kids=[];
  pags.forEach(function(p,i){
    var idc=5+i*2,idp=6+i*2,cont=p.join("\n");
    lista[idc]="<< /Length "+cont.length+" >>\nstream\n"+cont+"\nendstream";

    kids.push(idp+" 0 R");
  });
  lista[2]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>";
  var pdf="%PDF-1.4\n",offs=[];
  for(var k=1;k<=total;k++){offs[k]=pdf.length;pdf+=k+" 0 obj\n"+lista[k]+"\nendobj\n";}
  var xref=pdf.length;
  pdf+="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(var q=1;q<=total;q++)pdf+=("0000000000"+offs[q]).slice(-10)+" 00000 n \n";
  pdf+="trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  var bytes=new Uint8Array(pdf.length);
  for(var b=0;b<pdf.length;b++)bytes[b]=pdf.charCodeAt(b)&255;
  return bytes;
}

  if(!$("okDesc")){var d=document.createElement("div");d.id="okDesc";d.className="msg ok";d.innerHTML="✅ <b>Descargado.</b> Búscalo en tu carpeta de Descargas y súbelo a Aules.";$("card").appendChild(d);}
}

function init(){
  $("card").addEventListener("click",alClic);
  $("card").addEventListener("input",alEscribir);
  $("atras").onclick=function(){pasoNav(-1);};
  $("sig").onclick=function(){pasoNav(1);};
  if(!stoOk)$("avisoSto").hidden=false;
  render();
}
arrancarRegistro();
init();
})();
